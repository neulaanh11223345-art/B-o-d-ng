html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.zi{font-family:var(--f-zh);color:var(--ink2);font-weight:inherit;margin-left:.35em}
.bl .zi,.stk .zi,.help .zi,.note .zi,.toast .zi,.tile .zi,.err .zi,.empty .zi,.fld>span .zi{display:block;margin-left:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
[hidden]{display:none!important}

/* ---------- thanh tiêu đề ---------- */
.bar{position:sticky;top:0;z-index:30;background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px;height:var(--bar-h);padding:0 12px}
.bar .logo{width:38px;height:38px;border:0;padding:0;background:none;border-radius:10px;flex:none}
.bar .logo svg{width:38px;height:38px;display:block}
.bar .back{width:40px;height:40px;border:0;background:var(--brand-bg);color:var(--brand);border-radius:12px;display:grid;place-items:center;flex:none}
.bar .ttl{flex:1;min-width:0;line-height:1.15}
.bar .ttl b{display:block;font-size:17px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl small{display:block;font-family:var(--f-zh);font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .me{border:0;background:var(--brand);color:#fff;height:38px;width:38px;border-radius:50%;font-size:14px;font-weight:700;display:grid;place-items:center;flex:none}
.bar .search-g{display:none}
.btn .stk{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.btn .stk .zi{font-size:.85em}
.stripe{display:none}
/* Chip trạng thái đồng bộ */
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;height:34px;padding:0 10px 0 8px;font-size:12.5px;font-weight:600;flex:none;max-width:46vw}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
.sync span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync.s-off i{background:var(--ink3)} .sync.s-cho i{background:var(--orange)} .sync.s-loi i{background:var(--red)}
.sync.s-cho{color:var(--orange);border-color:color-mix(in srgb,var(--orange) 40%,var(--line))}
.sync.s-loi{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line));background:var(--red-bg)}
.sync.s-off{color:var(--ink2)}
@media (max-width:360px){.sync span{display:none}.sync{padding:0 10px}}
.netbar{display:block;width:100%;border:0;text-align:left;padding:8px 16px;font-size:13px;background:var(--orange-bg);color:var(--ink)}
.netbar.err{background:var(--red-bg)}
.netbar .in{max-width:1240px;margin:0 auto;display:flex;gap:8px;align-items:center}

/* ---------- khung trang ---------- */
main{max-width:1240px;margin:0 auto;padding:16px 16px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px))}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.sec h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.01em}
.sec h2 .cnt{font-family:var(--f-mono);font-weight:500;color:var(--ink2);margin-left:4px}
.sec .lnk{border:0;background:none;color:var(--blue);font-size:13px;padding:4px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px 16px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px 11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row:active{background:var(--soft)}
.row .main{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.row .sub{font-size:12.5px;color:var(--ink2);margin-top:2px;overflow-wrap:anywhere}
.row .end{display:flex;align-items:center;gap:8px;flex:none}
.chev{color:var(--ink3);flex:none}
.okbtn{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--green);background:var(--green-bg);color:var(--green);display:grid;place-items:center;flex:none}
.okbtn:active{background:var(--green);color:#fff}
.code{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--ink2);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.empty{padding:22px 16px;text-align:center;color:var(--ink2);font-size:14px}

/* ---------- nhãn trạng thái ---------- */
.gap{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.gaph{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 14px;background:none;border:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.gaph .gt{flex:1;font-weight:600;min-width:0}
.gaph .gt .zi{display:block;font-weight:500;font-size:.82em;color:var(--ink2)}
.gaph .gn{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.gaph .chev{flex:none;color:var(--ink3);transition:transform .15s}
.gap.mo .gaph .chev{transform:rotate(90deg)}
.gap.g-qua{border-color:color-mix(in srgb,var(--red) 35%,var(--line))} .gap.g-qua .gn{color:var(--red)}
.gap.g-nay .gn{color:var(--orange)} .gap.g-sap .gn{color:var(--blue)}
.gap.g-toi .gt{display:flex;align-items:center;gap:10px}
.gap.g-toi .gti{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue);flex:none}
.gap.g-toi .gn{color:var(--blue)} .gap.g-toi.g-qua .gn{color:var(--red)}
.gapb{border-top:1px solid var(--line)} .gapb .list{border:0;border-radius:0;margin:0}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.chtile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer;border-left:4px solid var(--line)}
.chtile b{font-size:16px} .chtile .zi{font-size:12px;color:var(--ink2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chtile .sub{font-size:12px;color:var(--ink2)} .chtile .cst{font-size:12px;font-weight:700;margin-top:2px}
.chtile.t-qua{border-left-color:var(--red)} .chtile.t-qua .cst{color:var(--red)}
.chtile.t-nay{border-left-color:var(--orange)} .chtile.t-nay .cst{color:var(--orange)}
.chtile.t-sap{border-left-color:var(--blue)} .chtile.t-sap .cst{color:var(--blue)}
.chtile.t-ok{border-left-color:var(--green)} .chtile.t-ok .cst{color:var(--green)}
.dctag{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;text-align:right;max-width:170px}
.dc-ok{background:var(--green-bg,#E3F4EA);color:var(--green)} .dc-canh{background:var(--orange-bg);color:var(--orange)} .dc-loi{background:var(--red-bg);color:var(--red)} .dc-chua{background:var(--soft);color:var(--ink2)}
.lkch .qc{font-size:12px;color:var(--ink2)}
.row2f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.chhead .sub{color:var(--ink2);margin-top:6px}
.pill{display:inline-flex;flex-direction:column;align-items:flex-end;justify-content:center;border-radius:9px;padding:4px 9px;font-size:12px;font-weight:600;line-height:1.2;white-space:nowrap;text-align:right}
.pill .zi{margin:0;font-weight:500;font-size:11px;color:inherit;opacity:.85}
.p-qua{background:var(--red-bg);color:var(--red)}
.p-nay{background:var(--orange-bg);color:var(--orange)}
.p-sap{background:var(--blue-bg);color:var(--blue)}
.p-ok{background:var(--soft);color:var(--ink2)}
.p-xong{background:var(--green-bg);color:var(--green)}
.p-cho{background:var(--orange-bg);color:var(--orange)}
.p-huy{background:var(--soft);color:var(--ink3)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600}

/* ---------- trang chủ ---------- */
.today{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:2px 0 14px}
.today .d{font-size:22px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.today .w{color:var(--ink2);font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:86px}
.tile b{font-size:30px;line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;font-weight:600;color:var(--ink)}
.tile .zi{font-weight:500}
.tile.t-qua b{color:var(--red)} .tile.t-nay b{color:var(--orange)} .tile.t-sap b{color:var(--blue)} .tile.t-xong b{color:var(--green)}
.tile.t-qua.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.tile.zero b{color:var(--ink3)}
.cta{margin-top:12px;width:100%;border:0;border-radius:16px;background:var(--brand);color:#fff;display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;font-weight:700;font-size:16.5px;box-shadow:0 6px 18px rgba(30,94,234,.28);min-height:64px}
.cta .ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;flex:none}
.cta .zi{display:block;margin:0;color:#DCE6FA;font-weight:500;font-size:13px}

/* ---------- nút, ô nhập ---------- */
.btn{display:inline-flex;flex-wrap:wrap;white-space:nowrap;text-decoration:none;align-items:center;justify-content:center;gap:0 8px;border:0;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px;background:var(--brand);color:#fff;min-height:48px;text-align:center}
.btn:active{background:var(--brand2)}
.btn .zi{color:inherit;opacity:.8}
.btn.bl{flex-direction:column;gap:0;line-height:1.25}
.btn.y{background:var(--brand);color:#fff}
.btn.g{background:var(--green);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:var(--red);border:1px solid var(--red)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1 1 140px}
.fld{display:block;margin:0 0 14px}
.fld>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.fld>span .zi{font-weight:500;font-size:12px}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:11px 12px;font-size:16px;min-height:46px}
.login .zi{color:var(--onnavy2)}
.login .err{line-height:1.45;text-align:left}
#apiIn{word-break:break-all;resize:none}
textarea.inp{min-height:76px;resize:vertical}
.inp:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.help{font-size:12.5px;color:var(--ink2);margin-top:6px}
.err{color:var(--red);font-size:13.5px;font-weight:600;margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.on .zi{color:#DCE6FA}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.searchbox .inp{padding-left:40px}
.switch{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.switch:first-child{border-top:0}
.switch .t{flex:1}
.switch input{appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--green)}
.switch input:checked::after{left:23px}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.stepper b{min-width:120px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- chi tiết máy ---------- */
.mhead{padding:16px}
.mhead h1{margin:6px 0 2px;font-size:21px;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.mhead .p2{color:var(--ink2);font-family:var(--f-zh)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;margin:0}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.kv dd .zi{font-weight:400}
.due{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.due .big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.due .lbl{font-size:12.5px;color:var(--ink2)}
.pre{white-space:pre-wrap;font-size:14px;margin:0}
.dates{display:flex;flex-wrap:wrap;gap:6px}
.dates span{font-family:var(--f-mono);font-size:12.5px;background:var(--blue-bg);color:var(--blue);border-radius:7px;padding:3px 8px}
.hrow{display:flex;gap:12px;padding:11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;align-items:flex-start}
.hrow:first-child{border-top:0}
.hrow .dd{font-family:var(--f-mono);font-weight:700;font-size:13px;min-width:48px;padding-top:1px}
.hrow .dd small{display:block;font-weight:500;color:var(--ink3);font-size:11px}
.hrow .main{flex:1;min-width:0}
.hrow.huy .nm,.hrow.huy .dd{text-decoration:line-through;color:var(--ink3)}

/* ---------- lịch ---------- */
.caltools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin:10px 0 12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);-webkit-overflow-scrolling:touch}
table.cal{border-collapse:separate;border-spacing:0;font-size:12px}
table.cal th,table.cal td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
table.cal thead th{position:sticky;top:0;background:var(--soft);z-index:2;font-weight:600;color:var(--ink2)}
table.cal .nmc{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;min-width:148px;max-width:180px;padding:6px 10px;font-weight:600;color:var(--ink);box-shadow:1px 0 0 var(--line)}
table.cal thead .nmc{z-index:3;background:var(--soft)}
table.cal .nmc .s{display:block;font-weight:400;font-size:11px;color:var(--ink3)}
table.cal .nmc button{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:12.5px;line-height:1.3;overflow-wrap:anywhere}
table.cal tr.grp th,table.cal tr.grp td{background:var(--bg)}
table.cal tr.grp th.nmc{background:var(--bg);font-size:12px;color:var(--ink2);font-weight:700;letter-spacing:.02em}
.yr td{min-width:62px;padding:5px 4px;vertical-align:middle}
.yr thead th.m{padding:6px 4px;min-width:62px}
.yr thead th.m button{border:0;background:none;font-weight:700;font-size:12.5px;line-height:1.2;color:var(--ink)}
.yr thead th.m button small{display:block;font-family:var(--f-zh);font-weight:500;color:var(--ink3)}
.yr .cur{background:var(--today)}
.cells{display:flex;flex-wrap:wrap;gap:3px}
.c{display:inline-grid;place-items:center;min-width:22px;height:20px;border-radius:5px;font-family:var(--f-mono);font-size:11px;font-weight:700;border:0;padding:0 3px}
.c-xong{background:var(--green);color:#fff}
.c-qua{background:var(--red);color:#fff}
.c-nay{background:var(--orange);color:#fff}
.c-kh{background:var(--blue-bg);color:var(--blue);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue) 35%,transparent)}
.mg td{width:26px;min-width:26px;height:30px;text-align:center}
.mg thead th.d{width:26px;min-width:26px;padding:3px 0;font-size:11px;line-height:1.15}
.mg thead th.d b{display:block;font-family:var(--f-mono);font-size:12px;color:var(--ink)}
.mg thead th.d i{display:block;font-style:normal;font-size:9.5px}
.mg .wk{background:var(--wkend)}
.mg thead th.wk{background:var(--wkend)}
.mg thead th.td{background:var(--amber);color:#16211F}
.mg thead th.td b{color:#16211F}
.mg td.td{box-shadow:inset 1px 0 0 var(--amber),inset -1px 0 0 var(--amber)}
.mg td .c{min-width:20px;height:20px;padding:0}
.agenda .day{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.agenda .day:first-child{border-top:0}
.agenda .day .dd{min-width:56px;font-family:var(--f-mono);font-weight:700;font-size:13px}
.agenda .day .dd small{display:block;font-family:var(--f-ui);font-weight:500;color:var(--ink3);font-size:11px}
.agenda .day.td{background:var(--today)}
.agenda .items{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.agenda .it{display:flex;gap:8px;align-items:center;border:0;background:none;padding:0;text-align:left;font-size:13.5px}
.agenda .it .c{flex:none}
.agenda .it span{overflow-wrap:anywhere}
.stat{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:0 0 10px}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- quét ---------- */
.reader{width:100%;max-width:420px;margin:0 auto;aspect-ratio:1/1;max-height:62vh;background:#0B0F0E;border-radius:16px;overflow:hidden;position:relative;display:grid;place-items:center;color:#AFC0BB;text-align:center;font-size:13px}
.reader video{object-fit:cover}
.reader .frame{position:absolute;inset:18%;border:3px solid #fff;border-radius:14px;pointer-events:none;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
.reader.idle .frame{display:none}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ---------- bảng dưới, thông báo ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,15,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 4px;font-size:18px;line-height:1.3}
.sheet h3 .zi{display:block;margin:0;font-size:14px;font-weight:500}
.sheet .who{color:var(--ink2);font-size:13.5px;margin-bottom:14px}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-bg{animation:none}}
/* ---------- ảnh đính kèm ---------- */
.anhsec{margin-top:14px}
.anhgrp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.anhbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1.5px dashed var(--line,#cfd6d4);border-radius:10px;background:transparent;color:var(--ink,#22302d);font-size:13px;font-weight:600;cursor:pointer}
.anhbtn small{font-weight:500;color:var(--ink2)}
.anhgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin-top:8px}
.anhcell{position:relative;width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft,#f1f3f2)}
.anhcell img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.anhcell .adel{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.anhcell .atag{position:absolute;left:3px;bottom:3px;padding:1px 6px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:600}
.anhds{width:42px;height:42px;border-radius:9px;overflow:hidden;background:var(--soft);flex:none;position:relative;cursor:pointer;border:0;padding:0}
.anhds img{width:100%;height:100%;object-fit:cover;display:block}
.anhds .acap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink3,#9aa7a3);font-size:22px;border:1.5px dashed var(--line);border-radius:9px;background:var(--card)}
.anhds .ax{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;border:0;font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.lkimg{width:32px;height:32px;border-radius:7px;object-fit:cover;margin-right:9px;flex:none;align-self:center;background:var(--soft)}
.lkimgbig{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#0b0f0e;margin-bottom:10px;display:block}
.anhview{background:#0b0f0e;color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom,0px));background:#0F1B2D;color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;z-index:80;max-width:min(92vw,480px);box-shadow:0 6px 24px rgba(0,0,0,.25);text-align:center}
.toast .zi{color:#C9D4D1;font-weight:500}
.toast.bad{background:var(--red);color:#fff}
.toast.bad .zi{color:#FFE3DF}

/* ---------- thanh dưới (điện thoại) ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h);align-items:center}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:600;color:var(--ink3);padding:4px 0;line-height:1.15;min-height:52px;justify-content:center}
.tab small{font-family:var(--f-zh);font-weight:500;font-size:11px}
.tab.on{color:var(--brand)}
.tab.on svg{color:var(--brand)}
.tab .sc svg,.tab.on .sc svg{color:#fff}
.tab .sc{width:56px;height:56px;border-radius:18px;background:var(--brand);color:#fff;display:grid;place-items:center;margin-top:-24px;box-shadow:0 6px 16px rgba(30,94,234,.35);border:3px solid var(--card)}
.tab .sc svg{width:26px;height:26px}
.badge{position:absolute;margin:-4px 0 0 18px;background:var(--red);color:#fff;border-radius:9px;min-width:18px;height:18px;font-size:11px;display:grid;place-items:center;padding:0 5px;font-family:var(--f-mono)}
.tabic{position:relative;display:grid;place-items:center;height:24px}
/* ---------- sidebar (máy tính) ---------- */
.side{display:none}
@media (min-width:1024px){
  .side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:var(--side-w);background:#0F2A5C;color:#DCE6FA;z-index:45;padding:14px 12px;overflow-y:auto}
  .side .brandrow{display:flex;align-items:center;gap:10px;padding:4px 6px 14px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
  .side .brandrow svg{width:40px;height:40px;flex:none}
  .side .brandrow b{display:block;font-size:15px;line-height:1.2;color:#fff}
  .side .brandrow small{display:block;font-family:var(--f-zh);font-size:12px;color:#AFC3EE}
  .side .nav{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:#DCE6FA;text-align:left;padding:10px 12px;border-radius:11px;font-size:14.5px;font-weight:600;line-height:1.2}
  .side .nav small{display:block;font-family:var(--f-zh);font-weight:500;font-size:11.5px;color:#9FB4E0}
  .side .nav svg{flex:none;opacity:.9}
  .side .nav:hover{background:rgba(255,255,255,.08)}
  .side .nav.on{background:var(--brand);color:#fff}
  .side .nav.on small{color:#DCE6FA}
  .side .nav .bdg{margin-left:auto;background:var(--red);color:#fff;border-radius:9px;min-width:20px;height:20px;font-size:11.5px;display:grid;place-items:center;padding:0 6px;font-family:var(--f-mono)}
  .side .grow{flex:1}
  .side .ver{font-family:var(--f-mono);font-size:11.5px;color:#8EA6D6;padding:8px 12px}
  .tabs{display:none}
  .bar,main,.netbar{margin-left:var(--side-w)}
  .bar .logo{display:none}
  main{padding:20px 28px 40px}
  .bar-in{padding:0 28px;height:64px}
  .bar .search-g{display:block;flex:0 1 360px;position:relative}
  .bar .search-g .inp{min-height:40px;padding:8px 12px 8px 38px;font-size:14px;background:var(--soft)}
  .bar .search-g svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3)}
  .toast{bottom:28px}
  .sheet-bg{align-items:center}
  .sheet{border-radius:18px;max-height:86vh}
}
/* ---------- đăng nhập ---------- */
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(36px + env(safe-area-inset-top,0px)) 16px 24px;background:linear-gradient(180deg,#E9F0FE 0%,var(--bg) 46%);color:var(--ink)}
.login .brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.login .brand svg{width:76px;height:76px}
.login h1{margin:4px 0 0;font-size:23px;letter-spacing:-.01em;color:var(--brand2)}
.login h1 small{display:block;font-family:var(--f-zh);font-size:16px;font-weight:500;color:var(--ink2);margin-top:2px}
.login .lbl{margin:22px 0 10px;color:var(--ink2);font-size:14px;text-align:center}
.login .zi{color:var(--ink2)}
.login .err{line-height:1.45}
.login .lcard{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-top:20px}
.login .lcard .fld{margin-bottom:10px}
.login .lcard .inp{font-family:var(--f-mono);font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.login .lcard .inp::placeholder{color:var(--line);font-weight:500}
.dots{display:flex;gap:14px;justify-content:center;margin:6px 0 10px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--ink3)}
.dots i.f{background:var(--brand);border-color:var(--brand)}
.pad{padding:14px 16px}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center;margin-top:8px}
.keypad button{height:62px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:24px;font-weight:600;font-family:var(--f-mono);box-shadow:var(--shadow)}
.keypad button:active{background:var(--brand-bg)}
.keypad button.fn{background:none;border:0;box-shadow:none;font-size:13.5px;font-family:var(--f-ui);color:var(--ink2)}
.login .err{color:var(--red);text-align:center;min-height:22px;font-weight:600}
.login .hint{margin-top:18px;font-size:12.5px;color:var(--ink2);text-align:center;max-width:340px}
.login .forgot{border:0;background:none;color:var(--brand);font-weight:600;font-size:14px;margin-top:14px;padding:8px}
.login .ver{margin-top:auto;padding-top:24px;font-size:12px;color:var(--ink3);font-family:var(--f-mono)}
.login .stripe{display:none}

/* ---------- tem QR ---------- */
.lblprev{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.qlabel{background:#fff;color:#16211F;border:1px dashed #B9C3C0;border-radius:8px;display:flex;gap:10px;align-items:center;padding:8px;overflow:hidden}
.qlabel svg{flex:none;width:92px;height:92px}
.qlabel .ti{min-width:0;display:flex;flex-direction:column;gap:3px}
.qlabel .cd{font-family:var(--f-mono);font-weight:700;font-size:13px}
.qlabel .nm{font-weight:700;font-size:13px;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qlabel .ck{font-size:11px;color:#3D4A47}
.qlabel .hn{font-size:9.5px;color:#55625F;line-height:1.25}
.checkrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.checkrow:first-child{border-top:0}
.checkrow input{width:22px;height:22px;flex:none;accent-color:var(--brand)}
/* ---- Tăng ca: tờ đơn theo mẫu giấy 自愿加班申请单 ---- */
.tcwrap{overflow-x:auto}
.tcsheet{background:#fff;color:#111;font-family:var(--f-giay);padding:22px 18px 24px;max-width:760px;margin:0 auto;position:relative}
.tcsheet+.tcsheet{margin-top:16px;border-top:1px dashed var(--line);padding-top:26px}
.tcsheet .co{text-align:center;font-weight:700;font-size:clamp(14px,3.4vw,17px);line-height:1.3}
.tcsheet .zh{font-family:var(--f-zh);font-size:.92em}
.tcsheet .co .zh{font-family:var(--f-zh);font-size:.92em}
.tcsheet .tt{text-align:center;font-weight:700;font-size:clamp(17px,4.8vw,23px);letter-spacing:.5px;margin-top:12px}
.tcsheet .tt .zh{display:block;font-family:var(--f-zh);font-size:.72em;letter-spacing:0;margin-top:3px}
.tcsheet .bo{display:flex;gap:14px;flex-wrap:wrap;margin:15px 0 4px;font-size:clamp(12px,3vw,14.5px);font-weight:700}
.tcsheet .bo u{text-decoration:none;border-bottom:1px solid #333;min-width:96px;display:inline-block;font-weight:400}
.tcsheet table{width:100%;border-collapse:collapse;font-size:clamp(11px,2.8vw,13.5px)}
.tcsheet .ai td{border:1px solid #333;padding:7px 8px;vertical-align:top}
.tcsheet .ai b{font-weight:700;display:block;font-size:.95em}
.tcsheet .ai .vl{display:block;margin-top:5px;border-bottom:1px dotted #333;min-height:18px;font-weight:400}
.tcsheet .ot{margin-top:9px}
.tcsheet .ot th,.tcsheet .ot td{border:1px solid #333;padding:7px 5px;text-align:center}
.tcsheet .ot th{font-weight:700;line-height:1.25}
.tcsheet .ot th .zh{display:block;font-family:var(--f-zh);font-weight:400;font-size:.88em}
.tcsheet .ot td{height:32px}
.tcsheet .ot td.ct{text-align:left;padding-left:8px}
.tcsheet .ot tr.tg td{font-weight:700}
.tcsheet .gc{margin-top:11px;font-size:clamp(10.5px,2.6vw,12.5px);line-height:1.5}
.tcsheet .gc .zh{font-family:var(--f-zh)}
.tcsheet .ky{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:26px;text-align:center;font-size:clamp(10.5px,2.6vw,13px);font-weight:700}
.tcsheet .ky span{display:block;font-family:var(--f-zh);font-weight:400;font-size:.88em;margin-top:2px}
.tcsheet .tto{position:absolute;right:18px;bottom:7px;margin:0;text-align:right;font-size:6px;line-height:1.2;color:#666}
.tcrow{width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink);display:flex;flex-direction:column;gap:8px;cursor:pointer;font:inherit}
.tcrow:hover{border-color:var(--brand)}
.tcrow .h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tcrow .no{width:26px;height:26px;flex:none;border-radius:8px;background:var(--brand-bg);color:var(--brand);font:700 12.5px var(--f-mono);display:grid;place-items:center}
.tcrow .g{margin-left:auto;font:700 17px var(--f-mono);color:var(--green)}
.tcrow .g i{font-style:normal;font-size:12px;font-weight:500;color:var(--ink3);margin-left:2px}
.tcrow.on{border-color:var(--brand);background:var(--brand-bg)}
.tcrow .sub{font-size:13px;color:var(--ink2)}
.tctot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.tctot .k{font-size:13.5px;color:var(--ink2);font-weight:600}
.tctot .v{font:700 23px var(--f-mono);color:var(--brand);font-variant-numeric:tabular-nums}
.tcadd{width:100%;margin-top:11px;border:1.5px dashed color-mix(in srgb,var(--brand) 45%,transparent);background:var(--brand-bg);color:var(--brand);font:600 15px var(--f-ui);padding:13px;border-radius:12px;cursor:pointer}
.tcgio{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--green-bg);border:1px solid color-mix(in srgb,var(--green) 25%,transparent);border-radius:10px;padding:10px 12px;margin:12px 0}
.tcgio span{font-size:13.5px;font-weight:600;color:var(--ink2)}
.tcgio input{width:78px;text-align:center;font:700 16px var(--f-mono);color:var(--green);background:var(--card);border:1px solid color-mix(in srgb,var(--green) 35%,transparent);border-radius:9px;padding:7px}
#printArea{display:none}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  @page{size:A4;margin:0}
  .psheet{width:210mm;height:297mm;display:grid;page-break-after:always;break-after:page;overflow:hidden}
  .tcsheet{width:210mm;min-height:296mm;max-width:none;margin:0;padding:15mm 13mm;page-break-after:always;break-after:page;border:0}
  .tcsheet:last-child{page-break-after:auto;break-after:auto}
  .tcsheet+.tcsheet{border-top:0;margin-top:0;padding-top:15mm}
  .tcsheet .co{font-size:15pt}.tcsheet .tt{font-size:20pt}.tcsheet table{font-size:11pt}.tcsheet .bo{font-size:12pt}
  .tcsheet .gc{font-size:9.5pt}.tcsheet .ky{font-size:11pt;margin-top:16mm}.tcsheet .ot td{height:9mm}
  .tcsheet .tto{right:13mm;bottom:7mm;font-size:5pt}
  .psheet:last-child{page-break-after:auto;break-after:auto}
  .psheet.s24{grid-template-columns:repeat(3,70mm);grid-auto-rows:37.125mm}
  .psheet.s8{grid-template-columns:repeat(2,105mm);grid-auto-rows:74.25mm}
  .pl{display:flex;align-items:center;gap:2.5mm;padding:2.5mm 3mm;overflow:hidden;color:#000;font-family:var(--f-ui)}
  .s24 .pl svg{width:30mm;height:30mm;flex:none}
  .s8 .pl{flex-direction:column;align-items:stretch;padding:4mm 5mm;gap:2mm}
  .s8 .pl .hz{height:4mm;background:repeating-linear-gradient(-45deg,#F5C400 0 3mm,#000 3mm 6mm);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .s8 .pl .bd{display:flex;gap:4mm;align-items:center}
  .s8 .pl svg{width:46mm;height:46mm;flex:none}
  .pl .ti{min-width:0;display:flex;flex-direction:column;gap:1mm}
  .pl .cd{font-family:var(--f-mono);font-weight:700;font-size:10pt}
  .pl .nm{font-weight:700;font-size:9.5pt;line-height:1.2;overflow-wrap:anywhere}
  .s8 .pl .cd{font-size:14pt}
  .s8 .pl .nm{font-size:13pt}
  .pl .ck{font-size:7.5pt}
  .pl .hn{font-size:6.5pt;line-height:1.2}
  .s8 .pl .ck{font-size:10pt}
  .s8 .pl .hn{font-size:8.5pt}
}

/* ---------- số điện ---------- */
.ecard{margin-top:12px;width:100%;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px;text-align:left}
.ecard .eic{width:42px;height:42px;border-radius:11px;background:var(--blue-bg);color:var(--blue);display:grid;place-items:center;flex:none}
.ecard .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ecard .nm{font-weight:600;font-size:15px;line-height:1.3}
.ecard .sub{font-size:12.5px;color:var(--ink2)}
.ecard .nm .zi{display:inline}
.ecard .sub .zi{display:block;margin:0}
.kyhead .kyrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.kyhead .lbl{font-size:12.5px;color:var(--ink2)}
.kyhead .big{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.prog{height:8px;border-radius:4px;background:var(--soft);border:1px solid var(--line);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--green);border-radius:0 4px 4px 0}
.seg.wide3{display:flex;width:100%}
.seg.wide3 button{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1.2;padding:7px 4px}
.seg.wide3 small{font-family:var(--f-zh);font-weight:500;font-size:11px;color:var(--ink3)}
.stepper button[disabled]{opacity:.35}
table.dtab th.pc{padding:6px 8px;text-align:center;min-width:128px;vertical-align:top}
table.dtab th.pc b{display:block;font-size:12.5px;color:var(--ink)}
table.dtab th.pc small{display:block;font-weight:500;font-size:10.5px;color:var(--ink3);white-space:normal}
table.dtab th.sub2{font-size:11px;padding:4px 6px;font-weight:600}
table.dtab td{padding:7px 8px;white-space:nowrap;font-size:12.5px}
table.dtab td.num{text-align:right;font-variant-numeric:tabular-nums}
table.dtab td.bad{color:var(--red);font-weight:700}
table.dtab td.who{font-size:12px;color:var(--ink2);min-width:120px;white-space:normal}
table.dtab tr.mt th,table.dtab tr.mt td{background:var(--soft)}
table.dtab tr.mt th.nmc{background:var(--soft);font-size:12px}
table.dtab tr.mt th small{display:block;font-weight:500;color:var(--ink3);font-size:10.5px}
table.dtab tr.miss td{color:var(--ink3)}
table.dtab .nmc button{font-family:var(--f-mono);font-size:12.5px;font-weight:700}
table.dtab .nmc{min-width:112px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .kl{font-size:12.5px;color:var(--ink2);font-weight:600}
.kpi .kl .zi{display:block;margin:0;font-weight:500}
.kpi .kv{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .kv small{font-size:12px;color:var(--ink2);font-weight:600}
.kpi .kd{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.35}
.kpi .kd .zi{display:block;margin:0}
.kd.up span[aria-hidden]{color:var(--red)} .kd.down span[aria-hidden]{color:var(--green)}
.kd.good span[aria-hidden]{color:var(--green)} .kd.warn span[aria-hidden]{color:var(--orange)}
.chartcard{margin-bottom:12px}
.chartcard h3.ch{margin:0 0 8px;font-size:14.5px;line-height:1.3}
.chartcard h3.ch .zi{font-weight:500}
.unit{font-size:11.5px;color:var(--ink3);font-weight:500;margin-left:6px}
.chart{position:relative;width:100%;min-height:40px}
.viz{display:block;overflow:visible;touch-action:pan-y}
.viz .grid{stroke:var(--line);stroke-width:1}
.viz .base{stroke:var(--ink3);stroke-width:1}
.viz .tick{fill:var(--ink2);font-size:11px;font-family:var(--f-mono)}
.viz .curx{fill:var(--ink);font-weight:700}
.viz .vlab{fill:var(--ink);font-size:11.5px;font-weight:700;font-family:var(--f-mono)}
.viz .s1{fill:var(--s1)} .viz .s2{fill:var(--s2)} .viz .s3{fill:var(--s3)}
.viz .ln{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.viz .area{fill:var(--s1);fill-opacity:.1}
.viz .dot,.viz .hdot{fill:var(--s1);stroke:var(--card);stroke-width:2}
.viz .xh{stroke:var(--ink3);stroke-width:1}
.viz .hit{fill:transparent;cursor:pointer;outline:none}
.viz .hit.on{fill:var(--ink);fill-opacity:.06}
.viz .hit.band.on{fill-opacity:0}
.viz .hit:focus-visible{stroke:var(--focus);stroke-width:2}

<body>
<div id="root"></div>
<div id="qrfile" style="display:none"></div>
<div id="printArea"></div>
<script>
// ===== XW: ghi file Excel .xlsx có màu, không cần thư viện ngoài =====
// XW.build([{name, rows:[[cell]], cols:[width], merges:['A1:C1'], freeze:{r,c}, heights:{1:28}, landscape}])
// cell: null | 'chữ' | số | {v, s:{b, sz, color, fill, align, valign, wrap, border, fmt, i}}
const XW = (() => {
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
  const col = (n) => { let s = ''; n += 1; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const argb = (c) => 'FF' + String(c).replace('#', '').toUpperCase();

  function Styles() {
    this.fonts = ['<font><sz val="10"/><color rgb="FF16211F"/><name val="Arial"/><family val="2"/></font>'];
    this.fills = ['<fill><patternFill patternType="none"/></fill>', '<fill><patternFill patternType="gray125"/></fill>'];
    this.borders = ['<border><left/><right/><top/><bottom/><diagonal/></border>'];
    this.fmts = [];
    this.xfs = ['<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'];
    this.cache = { '{}': 0 };
  }
  Styles.prototype.idx = function (arr, x) { let i = arr.indexOf(x); if (i < 0) { arr.push(x); i = arr.length - 1; } return i; };
  Styles.prototype.get = function (st) {
    if (!st) return 0;
    const key = JSON.stringify(st);
    if (key in this.cache) return this.cache[key];
    const font = '<font>' + (st.b ? '<b/>' : '') + (st.i ? '<i/>' : '') + '<sz val="' + (st.sz || 10) + '"/><color rgb="' +
      argb(st.color || '#16211F') + '"/><name val="Arial"/><family val="2"/></font>';
    const fontId = this.idx(this.fonts, font);
    const fillId = st.fill ? this.idx(this.fills, '<fill><patternFill patternType="solid"><fgColor rgb="' + argb(st.fill) +
      '"/><bgColor indexed="64"/></patternFill></fill>') : 0;
    let borderId = 0;
    if (st.border) {
      const c = argb(st.border === true ? '#C9D1CF' : st.border);
      const e = (k) => '<' + k + ' style="thin"><color rgb="' + c + '"/></' + k + '>';
      borderId = this.idx(this.borders, '<border>' + e('left') + e('right') + e('top') + e('bottom') + '<diagonal/></border>');
    }
    let fmtId = 0;
    if (st.fmt) {
      const builtIn = { '0': 1, '@': 49 };
      if (builtIn[st.fmt] !== undefined) fmtId = builtIn[st.fmt];
      else { let i = this.fmts.indexOf(st.fmt); if (i < 0) { this.fmts.push(st.fmt); i = this.fmts.length - 1; } fmtId = 164 + i; }
    }
    let al = '';
    if (st.align || st.valign || st.wrap) {
      al = '<alignment' + (st.align ? ' horizontal="' + st.align + '"' : '') + ' vertical="' + (st.valign || 'center') + '"' +
        (st.wrap ? ' wrapText="1"' : '') + '/>';
    }
    const xf = '<xf numFmtId="' + fmtId + '" fontId="' + fontId + '" fillId="' + fillId + '" borderId="' + borderId + '" xfId="0"' +
      (fmtId ? ' applyNumberFormat="1"' : '') + (fontId ? ' applyFont="1"' : '') + (fillId ? ' applyFill="1"' : '') +
      (borderId ? ' applyBorder="1"' : '') + (al ? ' applyAlignment="1">' + al + '</xf>' : '/>');
    this.xfs.push(xf);
    return (this.cache[key] = this.xfs.length - 1);
  };
  Styles.prototype.xml = function () {
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      (this.fmts.length ? '<numFmts count="' + this.fmts.length + '">' + this.fmts.map((f, i) => '<numFmt numFmtId="' + (164 + i) + '" formatCode="' + esc(f) + '"/>').join('') + '</numFmts>' : '') +
      '<fonts count="' + this.fonts.length + '">' + this.fonts.join('') + '</fonts>' +
      '<fills count="' + this.fills.length + '">' + this.fills.join('') + '</fills>' +
      '<borders count="' + this.borders.length + '">' + this.borders.join('') + '</borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="' + this.xfs.length + '">' + this.xfs.join('') + '</cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  };

  function sheetXml(sh, S) {
    const out = [];
    out.push('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">');
    out.push('<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>');
    if (sh.freeze && (sh.freeze.r || sh.freeze.c)) {
      const r = sh.freeze.r || 0, c = sh.freeze.c || 0;
      const pane = c && r ? 'bottomRight' : (r ? 'bottomLeft' : 'topRight');
      out.push('<sheetViews><sheetView workbookViewId="0"><pane' + (c ? ' xSplit="' + c + '"' : '') + (r ? ' ySplit="' + r + '"' : '') +
        ' topLeftCell="' + col(c) + (r + 1) + '" activePane="' + pane + '" state="frozen"/></sheetView></sheetViews>');
    } else out.push('<sheetViews><sheetView workbookViewId="0"/></sheetViews>');
    out.push('<sheetFormatPr defaultRowHeight="15"/>');
    if (sh.cols && sh.cols.length) {
      out.push('<cols>' + sh.cols.map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join('') + '</cols>');
    }
    out.push('<sheetData>');
    sh.rows.forEach((row, ri) => {
      const h = sh.heights && sh.heights[ri + 1];
      const cells = [];
      (row || []).forEach((cell, ci) => {
        if (cell === null || cell === undefined) return;
        const o = (typeof cell === 'object') ? cell : { v: cell };
        const ref = col(ci) + (ri + 1);
        const s = S.get(o.s);
        const sa = s ? ' s="' + s + '"' : '';
        if (o.v === null || o.v === undefined || o.v === '') { if (s) cells.push('<c r="' + ref + '"' + sa + '/>'); return; }
        if (typeof o.v === 'number' && isFinite(o.v)) cells.push('<c r="' + ref + '"' + sa + '><v>' + o.v + '</v></c>');
        else cells.push('<c r="' + ref + '"' + sa + ' t="inlineStr"><is><t xml:space="preserve">' + esc(o.v) + '</t></is></c>');
      });
      out.push('<row r="' + (ri + 1) + '"' + (h ? ' ht="' + h + '" customHeight="1"' : '') + '>' + cells.join('') + '</row>');
    });
    out.push('</sheetData>');
    if (sh.merges && sh.merges.length) out.push('<mergeCells count="' + sh.merges.length + '">' + sh.merges.map((m) => '<mergeCell ref="' + m + '"/>').join('') + '</mergeCells>');
    out.push('<pageMargins left="0.3" right="0.3" top="0.4" bottom="0.4" header="0.2" footer="0.2"/>');
    const fit = sh.fit || { w: 1, h: 0 };
    out.push('<pageSetup paperSize="9" orientation="' + (sh.landscape ? 'landscape' : 'portrait') + '" fitToWidth="' + fit.w + '" fitToHeight="' + fit.h + '"/>');
    out.push('</worksheet>');
    return out.join('');
  }

  // ----- ZIP (lưu không nén) -----
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zip(files) {
    const enc = new TextEncoder(), parts = [], central = [];
    let off = 0;
    const d = new Date(), dt = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF,
      dd = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
    files.forEach((f) => {
      const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, dt, true); h.setUint16(12, dd, true); h.setUint32(14, crc, true);
      h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
      c.setUint16(10, 0, true); c.setUint16(12, dt, true); c.setUint16(14, dd, true); c.setUint32(16, crc, true);
      c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true);
      c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), name);
      off += 30 + name.length + data.length;
    });
    const csize = central.reduce((a, b) => a + b.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, csize, true); e.setUint32(16, off, true);
    const all = parts.concat(central, [new Uint8Array(e.buffer)]);
    const out = new Uint8Array(all.reduce((a, b) => a + b.length, 0));
    let p = 0; all.forEach((b) => { out.set(b, p); p += b.length; });
    return out;
  }

  function sheetName(n, used) {
    let s = String(n).replace(/[\[\]\*\?\/\\:]/g, ' ').slice(0, 31) || 'Sheet';
    let k = s, i = 2; while (used.has(k)) k = s.slice(0, 28) + ' ' + (i++);
    used.add(k); return k;
  }

  function build(sheets) {
    const S = new Styles(), used = new Set();
    const names = sheets.map((sh) => sheetName(sh.name, used));
    const files = [];
    files.push({ name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      sheets.map((_, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('') + '</Types>' });
    files.push({ name: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' });
    files.push({ name: 'xl/workbook.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>' +
      names.map((n, i) => '<sheet name="' + esc(n) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>').join('') + '</sheets>' +
      (sheets.some((sh) => sh.printTitles) ? '<definedNames>' + sheets.map((sh, i) => {
        if (!sh.printTitles) return '';
        const q = "'" + names[i].replace(/'/g, "''") + "'!", pt = sh.printTitles, parts = [];
        if (pt.cols) parts.push(q + pt.cols.split(':').map((c) => '$' + c).join(':'));
        if (pt.rows) parts.push(q + pt.rows.split(':').map((r) => '$' + r).join(':'));
        return '<definedName name="_xlnm.Print_Titles" localSheetId="' + i + '">' + esc(parts.join(',')) + '</definedName>';
      }).join('') + '</definedNames>' : '') + '</workbook>' });
    files.push({ name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      sheets.map((_, i) => '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') +
      '<Relationship Id="rId' + (sheets.length + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' });
    sheets.forEach((sh, i) => files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: sheetXml(sh, S) }));
    files.push({ name: 'xl/styles.xml', data: S.xml() });
    return new Blob([zip(files)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  return { build, col };
})();

'use strict';

const IS_DEMO = MODE === 'demo';
const LIB = {

  qr: 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'
};

const TX = {
  appName: ['Quản lý thiết bị', '设备管理'],
  home: ['Trang chủ', '首页'], cal: ['Lịch', '日历'], scan: ['Quét', '扫码'], machines: ['Thiết bị', '设备'], history: ['Lịch sử', '记录'],

async function doConfirm(el) {

  if (!validD(ngay) || ngay > today || diffD(today, ngay) > 366) return showErr(t('needDate'));
  if (!nguoi) return showErr(t('needPerformer'));
  const ct = ktCollect(S.V.byMa[ma]);
  if (ct.err) return showErr(ct.err);
  el.disabled = true;
  const pl = { ma, ngay, nguoi, ghiChu };

// ---------- Tem QR ----------
function appLink() { return location.origin + location.pathname; }
function qrText(ma) { return IS_DEMO || !/^https?:/.test(location.protocol) ? ma : appLink() + '?m=' + encodeURIComponent(ma); }
function qrSvg(text) {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), qz = 2; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + (c + qz) + ' ' + (r + qz) + 'h1v1h-1z';
  return `<svg viewBox="0 0 ${n + qz * 2} ${n + qz * 2}" shape-rendering="crispEdges" role="img" aria-label="QR ${esc(text)}"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function labelInner(m, big) {
  const ct = S.V.ctByMa[m.ma] === m, ch = S.V.chByMa[m.ma] === m;
  const info = ct ? `${esc(tv('heSo'))} ×${fmtNum(m.heSo, 'raw')}${m.soCongTo ? ' · ' + esc(m.soCongTo) : ''}`
    : ch ? esc(m.tenZh || '') + (m.maHT ? ' · ' + esc(m.ma) : '')
    : `${esc(tv('cycle'))} ${m.chuKy} ${esc(tv('days', { n: '' }).trim())} · ${esc(tz('cycle'))}${m.chuKy}${esc(tz('days', { n: '' }))}`;
  const hint = ct ? 'lblDien' : ch ? 'lblCh' : 'lblScan';
  const body = `${qrSvg(qrText(m.ma))}<div class="ti"><div class="cd">${esc(ct ? m.ma : mh(m.ma))}</div><div class="nm">${esc(ch ? (m.ten || m.ma) : m.ten)}</div>
    <div class="ck">${info}</div>
    <div class="hn">${esc(tv(hint))}<br>${esc(tz(hint))}</div></div>`;
  return big ? `<div class="hz"></div><div class="bd">${body}</div>` : body;
}

async function saveFile(blob, name) {

  openSheet(`<div class="grab"></div><h3>${tv('fileReady')}<span class="zi">${tz('fileReady')}</span></h3>

    <p class="help" style="margin:-4px 0 14px">${t('exportWhat')}</p>
    <div class="btns"><a class="btn" id="dlLink" href="${url}" download="${esc(name)}">${IC.dl} ${t('download')}</a>

}

// Đọc tệp đã chọn: ảnh nén lại (ảnh lớn + ảnh nhỏ), tệp khác giữ nguyên
function tlDocTep(file) {
  return new Promise((resolve, reject) => {
    const duoi = (file.name.split('.').pop() || '').toLowerCase(), mime = (file.type || TL_DUOI[duoi] || '').toLowerCase();
    const ten = file.name.replace(/\.[^.]+$/, '').slice(0, 120);
    if (mime.indexOf('image/') === 0) {
      Promise.all([imgCompress(file, 1600, 400), imgCompress(file, 360, 28)]).then(([data, nho]) => resolve({ ten, mime: 'image/jpeg', data, nho, size: Math.round(data.length * 0.75) }), reject);
      return;
    }
    if (!Object.values(TL_DUOI).includes(mime) || /heic/.test(mime)) { reject({ code: 'TEP_KHONG_HO_TRO' }); return; }
    if (file.size > TL_MAX) { reject({ code: 'TEP_QUA_LON' }); return; }
    const rd = new FileReader();
    rd.onload = () => resolve({ ten, mime, data: String(rd.result).replace(/^data:[^;,]*/, 'data:' + mime), size: file.size });
    rd.onerror = () => reject({ code: 'TEP_SAI' });
    rd.readAsDataURL(file);
  });
}

function tlDataBlob(data) {

}

const TL_LOC = ['chuaMay', 'chuaNhom', 'mat', 'tatCa'];
function tlLocDS(loc, q) {
  const k = (q || '').trim().toLowerCase();
  return tlAll().filter((x) => {
    if (loc === 'chuaMay' && x.ma) return false;
    if (loc === 'chuaNhom' && x.nhom && x.nhom !== 'KHAC') return false;
    if (loc === 'mat' && x.conTrenDrive) return false;
    if (!k) return true;
    return [x.ten, x.duongDan, x.ma, mh(x.ma), tlTenMa(x.ma)].some((v) => String(v || '').toLowerCase().includes(k));
  }).sort((a, b) => (a.duongDan || '').localeCompare(b.duongDan || '') || (a.ten || '').localeCompare(b.ten || ''));
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = ACT[el.dataset.act];
  if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row[role="button"]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape') closeSheet();
  const inInput = e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if ($('.login #dots') && !inInput && /^[0-9]$/.test(e.key)) keyPress(e.key);
  if ($('.login #dots') && !inInput && e.key === 'Backspace') keyPress('b');
});
window.addEventListener('online', () => { setOffline(false); flush(); });
window.addEventListener('offline', () => setOffline(true));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !S.tk || !S.base) return;
  if (S.Q.some((q) => q.st === 'cho')) flush();
  if (Date.now() - S.lastLoad > 60000) refresh(true);
});
setInterval(() => { if (S.tk && S.Q.some((q) => q.st === 'cho')) flush(); }, 30000);

function soBinhQuan(c, ky, code, tt, ngay) {

  const hist = (S.V.csMa[c.ma] || []).filter((x) => x.ky < ky && x.trangThai === 'OK').slice(-3)

function nkGiaTri(o) {
  if (o === null || o === undefined || o === '') return '—';
  if (typeof o !== 'object') return esc(String(o));
  if (o.giaTri) return '<span class="mono">' + esc(qGiaTri(o.giaTri)) + '</span>' + (o.trangThai && o.trangThai !== 'OK' ? ' · ' + esc(o.trangThai) : '');
  if (o.den !== undefined) return esc(o.den ? fmtD(o.den) : '—');
  if (o.maKho !== undefined) return '<span class="mono">' + esc(o.maKho || '—') + '</span>';
  if (o.tonMin !== undefined) return '<span class="mono">' + esc(o.tonMin === '' ? '—' : o.tonMin) + '</span>';
  if (o.heSo !== undefined) return '×' + esc(o.heSo) + (o.cha ? ' · ⊂ ' + esc(o.cha) : '');
  const k = Object.keys(o).slice(0, 4);
  return esc(k.map((x) => x + ': ' + (typeof o[x] === 'object' ? JSON.stringify(o[x]) : o[x])).join(' · ')).slice(0, 200);
}

const soG = (v) => (v === '' || v === null || v === undefined || isNaN(v) ? '' : fmtNum(+v, 'raw'));

  if (!s) return null;

function nguongTxt(h) {

  if (a !== '' && b !== '') return a + '–' + b + dv;

}

function ketQuaCuoi(ma) {

  (S.V.lsMa[ma] || []).forEach((x) => {
    const c = x.chiTiet; if (!c) return;
    (c.kt || []).concat(c.so || []).forEach((h) => {
      const o = Object.assign({ ngay: x.ngay }, h);

function thongKeLK(ma) {

    const c = x.chiTiet; if (!c || !c.lk) return;
    c.lk.forEach((k) => {
      const s = st[k.id] = st[k.id] || { id: k.id, ten: k.ten, quyCach: k.quyCach, dv: k.dv, nam: {}, ds: [] };
      const y = x.ngay.slice(0, 4), n = s.nam[y] = s.nam[y] || { thay: 0, bs: 0, lan: 0 };

// Gom dữ liệu để gửi; trả { err } hoặc { v: chiTiet hoặc null }
function ktCollect(m) {
  const f = S.ctF || { kt: {}, lk: [] };
  const hmOK = hmOf(m).filter((h) => h.kieu !== 'SO'), hmSO = hmOf(m).filter((h) => h.kieu === 'SO');
  const kt = [], so = [], lk = [];
  const miss = hmOK.filter((h) => !f.kt[h.id]);
  if (miss.length) {
    miss.forEach((h) => { const r = $(`.ktrow[data-id="${CSS.escape(h.id)}"]`); if (r) r.classList.add('miss'); });
    const r0 = $(`.ktrow[data-id="${CSS.escape(miss[0].id)}"]`); if (r0) r0.scrollIntoView({ block: 'center', behavior: 'smooth' });
    const fe = $('#fErr'); if (fe) fe.dataset.kt = '1';
    return { err: t('ktConN', { n: miss.length }) };
  }
  hmOK.forEach((h) => { const o = f.kt[h.id]; kt.push({ id: h.id, ten: h.ten, kq: o.kq, gc: o.kq === 'LOI' ? (o.gc || '').trim() : '' }); });
  for (const h of hmSO) {
    const inp = $(`[data-so="${CSS.escape(h.id)}"]`); if (!inp) continue;
    const v = parseSo(inp.value);
    if (v === null) continue;
    if (isNaN(v)) { inp.focus(); return { err: t('soSai', { m: h.ten }) }; }
    so.push({ id: h.id, ten: h.ten, v, dv: h.dv || '', min: h.min === undefined ? '' : h.min, max: h.max === undefined ? '' : h.max, vuot: vuotNguong(v, h) });
  }
  const lr = lkCollect(m);
  if (lr.err) return lr;
  lk.push(...lr.v);
  const anh = (f.anh || []).filter((a) => a && a.data).map((a) => ({ loai: a.loai || '', data: a.data })).slice(0, ANH_TOI_DA);
  return { v: kt.length || so.length || lk.length || anh.length ? { kt, so, lk, anh } : null };
}
// Linh kiện đã dùng trong S.ctF (bảo dưỡng / sửa chữa): trả { err } hoặc { v: [...] }
function lkCollect(m) {
  const f = S.ctF || { lk: [] }, ds = lkOf(m), lk = [];
  for (const r of f.lk) {
    const sl = parseSo(r.sl);
    if (r.id === '__khac' || !ds.length) {
      const ten = (r.ten || '').trim();
      if (!ten) return { err: t('needLKTen') };
      if (!(sl > 0)) return { err: t('needSL') };
      const kx = khoGet(r.maKho);
      const co = (kx && ds.find((x) => { const g = khoGet(x.maKho); return g && g.ma === kx.ma; })) || ds.find((x) => norm(x.ten) === norm(ten));
      if (co) lk.push({ id: co.id, ten: co.ten, quyCach: co.quyCach || '', dv: co.dv || '', sl, loai: r.loai || 'THAY', maKho: co.maKho });
      else lk.push({ id: r.newId || (r.newId = newId('LK')), ten, quyCach: kx ? (r.quyCach || '') : '', dv: (r.dv || '').trim(), sl, loai: r.loai || 'THAY', maKho: kx ? kx.ma : undefined });
    } else {
      const k = ds.find((x) => x.id === r.id); if (!k) continue;
      if (!(sl > 0)) return { err: t('needSL') };
      lk.push({ id: k.id, ten: k.ten, quyCach: k.quyCach || '', dv: k.dv || '', sl, loai: r.loai || 'THAY', maKho: k.maKho });
    }
  }
  return { v: lk };
}

function dsNew(k) { return k === 'hm' ? { id: newId('HM'), ten: '', kieu: 'OK' } : { id: newId('LK'), ten: '', quyCach: '', dv: '', sl: '', ghiChu: '' }; }
// Thêm các mục chưa có (so theo tên) vào danh sách đang sửa
function dsMerge(p, items) {
  const co = {}, ids = {};
  p.ds.forEach((x) => { co[norm(x.ten)] = 1; ids[x.id] = 1; });
  let n = 0;
  items.forEach((x) => {
    if (!x.ten || co[norm(x.ten)]) return;
    const o = JSON.parse(JSON.stringify(x));
    if (!o.id || ids[o.id]) o.id = newId(p.k === 'hm' ? 'HM' : 'LK');
    co[norm(o.ten)] = 1; ids[o.id] = 1; p.ds.push(o); n++;
  });
  render();
  toast(n ? t('daThemN', { n }) : t('khongMoi'), !n);
}
function dsCopySheet() {
  const p = topV().p, m = S.V.byMa[p.ma], key = p.k === 'hm' ? 'hangMuc' : 'linhKien';
  const list = S.V.may.filter((x) => x.ma !== p.ma && (x[key] || []).length)
    .sort((a, b) => ((b.nhom === m.nhom) - (a.nhom === m.nhom)) || a.ma.localeCompare(b.ma));
  openSheet(`<div class="grab"></div><h3>${tv('chonMay')}<span class="zi">${tz('chonMay')}</span></h3>
    ${list.length ? `<div class="list" style="margin-top:10px">${list.map((x) => `<button class="row" data-act="dsCopyFrom" data-ma="${esc(x.ma)}"><div class="main"><div class="nm">${esc(x.ten)}</div>
      <div class="sub"><span class="code">${esc(mh(x.ma))}</span> · ${esc(x.nhom || '—')} · ${(x[key] || []).length} ${esc(tp(p.k === 'hm' ? 'ktHead' : 'lkHead'))}</div></div>${IC.chev}</button>`).join('')}</div>` : `<div class="card empty">${t('notFound')}</div>`}
    <div class="btns" style="margin-top:14px"><button class="btn ghost" data-act="closeSheet">${t('close')}</button></div>`);
}
function dsFromND() {
  const p = topV().p, m = S.V.byMa[p.ma];
  const items = String(m.noiDung || '').split(/\n|;|；/).map((s) => s.replace(/^\s*(?:[-•*·+]|\d+\s*[.)、:：-])\s*/, '').trim()).filter((s) => s.length > 1)
    .map((ten) => ({ id: newId('HM'), ten: ten.slice(0, 120), kieu: 'OK' }));
  dsMerge(p, items);
}
async function dsSave(el) {
  const p = topV().p, hm = p.k === 'hm';
  const fe = $('#dsErr'), show = (h) => { fe.innerHTML = h; fe.hidden = false; };
  const ds = [];
  for (const x of p.ds) {
    const ten = String(x.ten || '').trim();
    if (!ten) continue;
    if (hm) {
      const o = { id: x.id, ten, kieu: x.kieu === 'SO' ? 'SO' : 'OK' };
      if (o.kieu === 'SO') {
        const a = parseSo(x.min), b = parseSo(x.max);
        if ((a !== null && isNaN(a)) || (b !== null && isNaN(b)) || (a !== null && b !== null && a > b)) return show(t('nguongSai', { m: ten }));
        o.min = a === null ? '' : a; o.max = b === null ? '' : b; o.dv = String(x.dv || '').trim();
      }
      ds.push(o);
    } else {
      const sl = parseSo(x.sl);
      if (sl !== null && (isNaN(sl) || sl < 0)) return show(t('SO_SAI') + ' — ' + esc(ten));
      ds.push({ id: x.id, ten, quyCach: String(x.quyCach || '').trim(), dv: String(x.dv || '').trim(), sl: sl === null ? '' : sl, ghiChu: String(x.ghiChu || '').trim(), maKho: x.maKho || undefined, anh: x.anh || '', anhData: x.anhData || undefined,
        viTriMay: String(x.viTriMay || '').trim(), mucDo: x.mucDo || undefined });
    }
  }
  el.disabled = true;
  try {
    const pl = { ma: p.ma, caNhom: !!p.caNhom }; pl[hm ? 'hangMuc' : 'linhKien'] = ds;
    const d = await api('saveLists', pl);
    mergeResult(d);
    toast(t('savedN', { n: (d.dsMay || [d.may]).length }));
    back();
  } catch (e) { el.disabled = false; show(e.code === 'MANG' ? t('needNet') : errMsg(e)); }
}

// ---------- Excel: 2 trang linh kiện ----------
function lkSheets(y) {
  const H = { b: 1, fill: '#16211F', color: '#FFFFFF', align: 'center', valign: 'center', wrap: 1, border: '#5B6B67' }, B = { border: true };
  const dung = [];
  S.V.ls.filter((x) => x.trangThai !== 'HUY' && x.ngay.slice(0, 4) === String(y) && x.chiTiet && (x.chiTiet.lk || []).length)
    .sort((a, b) => (a.ngay > b.ngay ? -1 : a.ngay < b.ngay ? 1 : 0))
    .forEach((x) => x.chiTiet.lk.forEach((k) => dung.push({ x, k })));
  // Chi tiết từng lần
  const r1 = [[{ v: tv('xLKTitle', { y }) + ' · ' + tz('xLKTitle', { y }), s: { b: 1, sz: 14 } }], []];
  const h1 = [tp('dateDone'), tp('code'), tp('name'), tp('group'), tp('lkTen'), tp('quyCach'), tp('sl'), tp('dv'), tp('xLoai'), tp('performer'), tp('xStatus'), tp('maKho')];
  const mkOf = (m, k) => { const g = khoGet(k.maKho || ((lkOf(m).find((y) => y.id === k.id) || {}).maKho)); return g ? g.ma : ''; };
  r1.push(h1.map((h) => ({ v: h, s: H })));
  dung.forEach(({ x, k }) => {
    const m = S.V.byMa[x.ma];
    r1.push([{ v: excelSerial(x.ngay), s: Object.assign({ fmt: 'dd/mm/yyyy', align: 'center' }, B) }, { v: x.ma, s: B }, { v: m ? m.ten : x.tenMay, s: B }, { v: m ? m.nhom : '', s: B },
      { v: k.ten, s: Object.assign({ b: 1 }, B) }, { v: k.quyCach || '', s: B }, { v: +k.sl, s: Object.assign({ align: 'center' }, B) }, { v: k.dv || '', s: B },
      { v: tp(k.loai === 'BOSUNG' ? 'boSung' : 'thay'), s: B }, { v: x.nguoi, s: B }, { v: x.cho ? tp('pending') : 'OK', s: B }, { v: mkOf(m, k), s: B }]);
  });
  const s1 = { name: tv('xLKSheet', { y }) + ' · ' + tz('xLKSheet', { y }), rows: r1, cols: [12, 7, 30, 20, 30, 14, 8, 10, 16, 24, 14, 13], merges: ['A1:L1'], freeze: { r: 3 }, heights: { 1: 24, 3: 30 }, landscape: 1, printTitles: { rows: '3:3' } };
  // Tổng theo máy
  const r2 = [[{ v: tv('xLKTongTitle', { y }) + ' · ' + tz('xLKTongTitle', { y }), s: { b: 1, sz: 14 } }], []];
  const h2 = [tp('code'), tp('name'), tp('group'), tp('lkTen'), tp('quyCach'), tp('dv'), tp('slMay'), tp('xSLThay'), tp('xSLBS'), tp('xSoLan'), tp('ganNhat'), tp('maKho'), tp('tonKho')];
  r2.push(h2.map((h) => ({ v: h, s: H })));
  const ordered = [];
  byGroup(S.V.may).forEach(([, a]) => a.forEach((m) => ordered.push(m)));
  ordered.forEach((m) => {
    const st = thongKeLK(m.ma), ids = lkOf(m).map((k) => k.id);
    Object.keys(st).forEach((id) => { if (ids.indexOf(id) < 0) ids.push(id); });
    ids.forEach((id) => {
      const k = lkOf(m).find((x) => x.id === id) || st[id], s = st[id], n = s && s.nam[y];
      const last = s && s.ds.find((d) => d.x.ngay.slice(0, 4) <= String(y));
      if (!m.hoatDong && !n) return;
      const zero = !n, kx = khoGet(k.maKho);
      const st2 = Object.assign({}, B, zero ? { color: '#86928F' } : {});
      r2.push([{ v: m.ma, s: st2 }, { v: m.ten, s: st2 }, { v: m.nhom, s: st2 }, { v: k.ten, s: Object.assign({ b: zero ? 0 : 1 }, st2) }, { v: k.quyCach || '', s: st2 }, { v: k.dv || '', s: st2 },
        { v: k.sl === '' || k.sl === undefined || k.sl === null ? '' : +k.sl, s: Object.assign({ align: 'center' }, st2) },
        { v: n ? n.thay : 0, s: Object.assign({ align: 'center', b: n && n.thay ? 1 : 0 }, st2) }, { v: n ? n.bs : 0, s: Object.assign({ align: 'center' }, st2) },
        { v: n ? n.lan : 0, s: Object.assign({ align: 'center' }, st2) },
        last ? { v: excelSerial(last.x.ngay), s: Object.assign({ fmt: 'dd/mm/yyyy', align: 'center' }, st2) } : { v: '', s: st2 },
        { v: kx ? kx.ma : '', s: st2 }, { v: kx && tonOf(kx) !== null ? tonOf(kx) : '', s: Object.assign({ align: 'center' }, st2, kx && tonOf(kx) === 0 ? { color: '#C8372D', b: 1 } : {}) }]);
    });
  });
  const s2 = { name: tv('xLKTong', { y }) + ' · ' + tz('xLKTong', { y }), rows: r2, cols: [7, 30, 20, 30, 14, 10, 10, 10, 10, 9, 12, 13, 9], merges: ['A1:M1'], freeze: { r: 3 }, heights: { 1: 24, 3: 30 }, landscape: 1, printTitles: { rows: '3:3' } };
  return [s2, s1];
}

  if (!f) return;

}
const khoKhoa = (ten, qc) => norm(ten).replace(/\s/g, '') + '|' + norm(qc).replace(/\s/g, '');
// So với kho đang có: giống cách máy chủ tính
function khoDiff(ds) {
  khoIx();
  const d = { moi: [], doiTon: [], het: [], veLai: [], doiTen: [], gop: [], giu: 0 }, theo = {}, erpKhoa = {};
  ds.forEach((o) => {
    theo[o.ma] = 1;
    const k = khoKhoa(o.ten, o.qc); if (!erpKhoa[k]) erpKhoa[k] = o.ma;
    const x = KHO_BY[o.ma];
    if (!x) { d.moi.push({ o }); return; }
    const cuTon = tonOf(x) || 0, doiTon = cuTon !== o.ton || JSON.stringify(x.vt || []) !== JSON.stringify(o.vt);
    const doiTen = x.ten !== o.ten || (x.qc || '') !== o.qc || (x.dv || '') !== o.dv || (x.nh || '') !== o.nh;
    if (!x.cf) d.veLai.push({ o, cu: cuTon }); else if (doiTon) d.doiTon.push({ o, cu: cuTon });
    if (doiTen) d.doiTen.push({ o, x });
    if (x.cf && !doiTon && !doiTen) d.giu++;
  });
  S.kho.ds.forEach((x) => {
    if (x.ng === 'ERP' && x.cf && !theo[x.ma]) d.het.push({ o: x, cu: tonOf(x) || 0 });
    if (x.ng === 'APP' && !x.gop && erpKhoa[khoKhoa(x.ten, x.qc)]) d.gop.push({ o: x, vao: erpKhoa[khoKhoa(x.ten, x.qc)] });
  });
  d.cuCf = S.kho.ds.filter((x) => x.ng === 'ERP' && x.cf).length;
  return d;
}

  if (!p.sua && p.tdTu && pl.tieuDe === p.tdGoc.trim()) pl.tieuDeDich = p.tdTu;   // tên điền sẵn, chưa sửa

  const x = S.V.cvById[p.id];

// ---------- Gợi ý cách xử lý từ lịch sử sửa chữa ----------
// So khớp mô tả sự cố với các lần sửa trước (bỏ dấu tiếng Việt, cặp chữ tiếng Trung), ưu tiên cùng máy rồi cùng loại máy.
const SC_STOP = new Set('may bi khong va cua cho thi la co mot cac nhung duoc da dang khi lai len xuong ra vao tren duoi phai trai bang voi de hay nen nhu the nay do ve tai luc sau truoc hon rat qua bao hong loi so'.split(' '));
function scTok(txt) {
  const out = new Set(), src = String(txt || '');
  (KHONG_DAU(src.toLowerCase()).match(/[a-z0-9]+/g) || []).forEach((w) => { if (w.length >= 2 && !SC_STOP.has(w)) out.add(w); });
  (src.match(/[一-鿿]+/g) || []).forEach((seg) => { if (seg.length === 1) out.add(seg); for (let i = 0; i < seg.length - 1; i++) out.add(seg.slice(i, i + 2)); });
  return out;
}
function scGoiY(ma, text, boId) {
  const ds = scTatCa().filter((x) => x.id !== boId && (x.ketQua || x.nguyenNhan));
  if (!ds.length) return [];
  const lk = loaiTB(ma), q = scTok(text);
  const docs = ds.map((x) => ({ x, tk: scTok([x.tieuDe, x.tieuDeDich, x.moTa, x.moTaDich].join(' ')) }));
  const df = {}; docs.forEach((d) => d.tk.forEach((w) => { df[w] = (df[w] || 0) + 1; }));
  const wt = (w) => Math.log(1 + ds.length / (df[w] || 1));
  let qw = 0; q.forEach((w) => { qw += wt(w); });
  const out = docs.map((d) => {
    let hit = 0; q.forEach((w) => { if (d.tk.has(w)) hit += wt(w); });
    const cungMay = !!ma && d.x.ma === ma, cungLoai = !!lk && loaiTB(d.x.ma) === lk;
    const sim = qw ? hit / qw : 0;
    return { x: d.x, sim, cungMay, cungLoai, diem: sim + (cungMay ? 0.35 : cungLoai ? 0.15 : 0) };
  }).filter((o) => (q.size ? o.sim >= 0.2 : o.cungMay));
  return out.sort((a, b) => b.diem - a.diem || (scNgay(b.x) > scNgay(a.x) ? 1 : -1)).slice(0, 3);
}

const TC_MAC_DINH = [{ k: 'HC', ten: 'Hành chính', zh: '行政班', tu: '17:30', den: '19:30' },
  { k: 'NGAY', ten: 'Ca ngày', zh: '日班', tu: '20:00', den: '22:00' },
  { k: 'DEM', ten: 'Ca đêm', zh: '夜班', tu: '06:00', den: '08:00' },
  { k: 'CN', ten: 'Chủ nhật', zh: '周日班', tu: '08:00', den: '17:00' }];
const tcCaDS = () => { const a = (S.base && S.base.caiDat && S.base.caiDat.caTangCa) || []; return a.length ? a : TC_MAC_DINH; };
const tcCaOf = (k) => tcCaDS().filter((c) => c.k === k)[0] || tcCaDS()[0];
const tcMaxThang = () => +((S.base && S.base.caiDat && S.base.caiDat.gioTCThang) || 40);
const tcMaxNam = () => +((S.base && S.base.caiDat && S.base.caiDat.gioTCNam) || 200);
const tcLaGio = (t) => /^([01]\d|2[0-3]):[0-5]\d$/.test(String(t || ''));
// Số tiếng tăng ca: đến giờ trừ từ giờ, qua 0 giờ vẫn đúng. Không trừ giờ nghỉ.
function tcGio(tu, den) {
  if (!tcLaGio(tu) || !tcLaGio(den)) return 0;
  let p = (+den.slice(0, 2) * 60 + +den.slice(3, 5)) - (+tu.slice(0, 2) * 60 + +tu.slice(3, 5));
  if (p <= 0) p += 24 * 60;
  return Math.round(p / 60 * 100) / 100;
}
const tcSo = (n) => fmtNum(Math.round((+n || 0) * 100) / 100);
// Tuần bắt đầu thứ Hai
function tcThuHai(d) { const w = wday(d); return addD(d, -((w + 6) % 7)); }
const tcTuanHT = () => S.f.tcTuan || tcThuHai(TODAY());
const tcThangHT = () => S.f.tcThang || TODAY().slice(0, 7);
const tcUid = () => S.f.tcUid || (S.me ? S.me.id : '');
const tcSuaDuoc = (uid) => uid === (S.me ? S.me.id : '') || xemHet();
function tcNguoi(uid) {
  const me = S.me || {}, n = (S.V && S.V.nvById && S.V.nvById[uid]) || {};
  const b = uid === me.id ? Object.assign({}, n, me) : n;
  return { id: uid, ten: b.ten || '', tenZh: b.tenZh || '', maNV: b.maNV || '', maThe: b.maThe || '',
    boPhan: b.boPhan || '', boPhanZh: b.boPhanZh || '', chucVu: b.chucVu || '' };
}
const tcLoc = (uid, tu, den) => (S.V.tc || []).filter((x) => x.uid === uid && x.ngay >= tu && x.ngay <= den)
  .sort((a, b) => (a.ngay < b.ngay ? -1 : a.ngay > b.ngay ? 1 : a.tu < b.tu ? -1 : 1));
const tcCong = (ds) => Math.round(ds.reduce((s, x) => s + (+x.soGio || 0), 0) * 100) / 100;
const tcThangCua = (uid, ym) => tcCong((S.V.tc || []).filter((x) => x.uid === uid && x.ngay.slice(0, 7) === ym));
const tcNamCua = (uid, y) => tcCong((S.V.tc || []).filter((x) => x.uid === uid && x.ngay.slice(0, 4) === y));
function tcCanhBao(uid, ym) {
  const th = tcThangCua(uid, ym), nam = tcNamCua(uid, ym.slice(0, 4));
  if (th > tcMaxThang()) return t('tcQuaThang', { g: tcMaxThang(), n: tcSo(th) });
  if (nam > tcMaxNam()) return t('tcQuaNam', { g: tcMaxNam(), n: tcSo(nam) });
  return '';
}

async function tcGui() {
  const p = topV().p, e = $('#tcErr');
  const bao = (m) => { e.hidden = false; e.textContent = m; };
  if (!tcLaGio(p.tu) || !tcLaGio(p.den) || p.tu === p.den) { bao(t('tcGioSai')); return; }
  const gio = Number(String(p.gio || '').replace(',', '.'));
  if (!(gio > 0 && gio <= 24)) { bao(t('tcGioSai')); return; }
  e.hidden = true;
  const btn = $('#tcOk'); btn.disabled = true;
  const r = await send('saveOT', { id: p.id || '', uid: p.uid, ngay: p.ngay, ca: p.ca, tu: p.tu, den: p.den, soGio: gio, lyDo: p.ly || '' });
  btn.disabled = false;
  if (r.err) { bao(errMsg(r.err)); return; }
  toast(r.queued ? t('savedLocal') : t('tcDaLuu'));
  S.f.tcTuan = tcThuHai(p.ngay); S.f.tcUid = p.uid;
  back();
}

function tcThangDS(ym) {
  const by = {};
  (S.V.tc || []).forEach((x) => { if (x.ngay.slice(0, 7) === ym) (by[x.uid] = by[x.uid] || []).push(x); });
  return Object.keys(by).map((uid) => {
    const a = by[uid], theo = {};
    a.forEach((x) => { theo[x.ca] = Math.round(((theo[x.ca] || 0) + (+x.soGio || 0)) * 100) / 100; });
    return { uid, n: tcNguoi(uid), theo, tong: tcCong(a), ds: a.sort((p, q) => (p.ngay < q.ngay ? -1 : 1)) };
  }).sort((p, q) => q.tong - p.tong || (p.n.ten < q.n.ten ? -1 : 1));
}

// ---------- Tồn kho an toàn: sửa trong app, hoặc tải file mẫu về sửa rồi tải lên ----------
// Nhận cả file mẫu của app lẫn bảng dự phòng của nhà máy (cột "Mã sản phẩm" + "Số lượng dự phòng").
// Mã sản phẩm phải là mã ERP (trùng mã trong kho); mã linh kiện của nhà cung cấp không khớp được.
const MIN_COT = {
  ma: ['品号', 'masanpham', 'masp', 'maerp', 'makho', 'ma', 'mahang', 'mavattu', 'code', 'itemcode', 'itemno', 'partno', 'malinhkien', 'malk'],
  min: ['安全库存', '安全存量', '备品数量', 'tonantoan', 'tonkhoantoan', 'soluongduphong', 'luongduphong', 'duphong', 'tkat',
    'tontoithieu', 'tonmin', 'safetystock', 'minstock', 'min'],
  ten: ['品名', 'tenlinhkien', 'ten', 'tenhang', 'tenvattu', 'name', 'itemname'],
  // Bảng của nhà máy để quy cách ở cột "Mã linh kiện" (vd φ12), nên nhận cả cột đó làm quy cách
  qc: ['规格', '规格型号', '型号', 'quycach', 'spec', 'specification', 'model', 'malinhkien', 'malk', 'machitiet'],
  dv: ['单位', '计量单位', 'dvt', 'donvi', 'donvitinh', 'unit', 'uom'],
  bo: ['botheodoi', 'bo', 'xoa', 'khongdung', 'ngungdung', 'khongmuanua', 'an', 'ankhoikho', '停用', '删除', '不用', 'remove', 'delete', 'hide']
};
const MIN_COT_N = {}; Object.keys(MIN_COT).forEach((k) => { MIN_COT_N[k] = MIN_COT[k].map(hNorm); });
// Ô đánh dấu trong file: x · 1 · có · bỏ · xoá · yes…
const DANH_DAU = ['x', '1', 'v', 'co', 'bo', 'xoa', 'yes', 'y', 'true', 'ok', '是', '停用', '删除'];
const laDanhDau = (v) => DANH_DAU.indexOf(norm(v).replace(/\s/g, '')) >= 0;
function timCotMin(rows) {
  for (let r = 0; r < Math.min(rows.length, 20); r++) {
    const h = (rows[r] || []).map((v) => hNorm(v)), cot = {};
    Object.keys(MIN_COT_N).forEach((k) => {
      for (const a of MIN_COT_N[k]) { const i = h.indexOf(a); if (i >= 0 && !Object.values(cot).includes(i)) { cot[k] = i; break; } }
    });
    if (cot.ma !== undefined && cot.min !== undefined) return { r, cot, ten: (rows[r] || []).map((v) => String(v === undefined ? '' : v).trim()) };
  }
  return null;
}
async function docFileMin(file) {
  const nm = String(file.name || '');
  if (/\.xls$/i.test(nm)) throw { code: 'FILE_XLS' };
  let sheets;
  if (/\.csv$|\.txt$/i.test(nm) || /csv|text\/plain/.test(file.type || '')) sheets = await readCsv(file);
  else {
    const buf = await file.arrayBuffer();
    try { sheets = await readXlsx(buf); } catch (e) { if (e && e.code) throw e; throw { code: 'FILE_SAI' }; }
  }
  for (const sh of sheets) {
    const rows = await sh.rows(), h = timCotMin(rows);
    if (!h) continue;
    const c = h.cot, by = {}, ds = [];
    let soDong = 0, boQua = 0;
    for (let i = h.r + 1; i < rows.length; i++) {
      const row = rows[i] || [];
      if (!row.some((v) => String(v === undefined ? '' : v).trim() !== '')) continue;
      const ma = clTxt(row[c.ma], 40).replace(/\s/g, '');
      if (!ma || /[\s"'<>]/.test(ma)) { boQua++; continue; }
      soDong++;
      const raw = String(row[c.min] === undefined || row[c.min] === null ? '' : row[c.min]).trim();
      const mn = raw === '' ? '' : soTxt(row[c.min]);
      if (by[ma] !== undefined) continue;
      by[ma] = 1;
      ds.push({ ma, tonMin: mn === '' || !(mn > 0) ? '' : rnd3(mn),
        ten: c.ten !== undefined ? clTxt(row[c.ten], 160) : '',
        qc: c.qc !== undefined ? clTxt(row[c.qc], 200) : '',
        dv: c.dv !== undefined ? clTxt(row[c.dv], 12) : '',
        bo: c.bo !== undefined && laDanhDau(row[c.bo]) });
    }
    if (!ds.length) continue;
    const cot = Object.keys(c).map((k) => h.ten[c[k]]).filter(Boolean);
    return { file: nm, sheet: sh.name, cot, ds, soDong, boQua, coBo: c.bo !== undefined };
  }
  throw { code: 'KHONG_COT_MIN' };
}
