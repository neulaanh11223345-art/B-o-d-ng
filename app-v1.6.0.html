<style>
:root{
  --bg:#EEF1F0; --card:#FFFFFF; --ink:#16211F; --ink2:#55625F; --ink3:#86928F; --line:#D7DEDC; --soft:#F5F7F6;
  --navy:#16211F; --navy2:#22302D; --onnavy:#FFFFFF; --onnavy2:#AFC0BB; --yellow:#F5C400; --onyellow:#16211F;
  --red:#C8372D; --red-bg:#FBE8E5; --orange:#D96A12; --orange-bg:#FDEEDF; --blue:#2F62B8; --blue-bg:#E4ECF9;
  --green:#2F8A3B; --green-bg:#E3F2E3; --wkend:#FBEFEF; --today:#FFF6CC; --focus:#2F62B8;
  --shadow:0 1px 2px rgba(22,33,31,.06),0 4px 14px rgba(22,33,31,.06);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --r:12px; --tab-h:64px;
  --f-ui:'Be Vietnam Pro','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-zh:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1514; --card:#18211F; --ink:#E5ECEA; --ink2:#A2AFAB; --ink3:#71807C; --line:#2A3633; --soft:#1D2825;
    --navy:#0A100F; --navy2:#1A2422; --onnavy2:#93A6A0;
    --red:#F2685C; --red-bg:#3B1D1A; --orange:#F39A4B; --orange-bg:#3A2715; --blue:#78A3EE; --blue-bg:#1A2842;
    --green:#6CC074; --green-bg:#18321C; --wkend:#241B1D; --today:#3A3413; --focus:#78A3EE;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1514; --card:#18211F; --ink:#E5ECEA; --ink2:#A2AFAB; --ink3:#71807C; --line:#2A3633; --soft:#1D2825;
  --navy:#0A100F; --navy2:#1A2422; --onnavy2:#93A6A0;
  --red:#F2685C; --red-bg:#3B1D1A; --orange:#F39A4B; --orange-bg:#3A2715; --blue:#78A3EE; --blue-bg:#1A2842;
  --green:#6CC074; --green-bg:#18321C; --wkend:#241B1D; --today:#3A3413; --focus:#78A3EE;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.zi{font-family:var(--f-zh);color:var(--ink2);font-weight:inherit;margin-left:.35em}
.bl .zi,.stk .zi,.help .zi,.note .zi,.toast .zi,.tile .zi,.err .zi,.empty .zi,.fld>span .zi{display:block;margin-left:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
[hidden]{display:none!important}

/* ---------- thanh tiêu đề ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:var(--onnavy)}
.bar-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;height:54px;padding:0 12px}
.bar .logo{width:36px;height:36px;border:0;padding:0;background:none;border-radius:9px;flex:none}
.bar .logo svg{width:36px;height:36px;display:block}
.bar .back{width:36px;height:36px;border:0;background:var(--navy2);color:var(--onnavy);border-radius:10px;display:grid;place-items:center;flex:none}
.bar .ttl{flex:1;min-width:0;line-height:1.15}
.bar .ttl b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl small{display:block;font-family:var(--f-zh);font-size:12px;color:var(--onnavy2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .me{border:0;background:var(--navy2);color:var(--onnavy);height:36px;min-width:36px;max-width:132px;padding:0 12px;border-radius:18px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;flex:none}
.bar .me .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn .stk{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.btn .stk .zi{font-size:.85em}
.stripe{height:5px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 9px,#16211F 9px 18px)}
.netbar{display:block;width:100%;border:0;text-align:left;padding:8px 16px;font-size:13px;background:var(--orange-bg);color:var(--ink)}
.netbar.err{background:var(--red-bg)}
.netbar .in{max-width:980px;margin:0 auto;display:flex;gap:8px;align-items:center}

/* ---------- khung trang ---------- */
main{max-width:980px;margin:0 auto;padding:16px 16px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px))}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.sec h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.01em}
.sec h2 .cnt{font-family:var(--f-mono);font-weight:500;color:var(--ink2);margin-left:4px}
.sec .lnk{border:0;background:none;color:var(--blue);font-size:13px;padding:4px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px 16px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px 11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row:active{background:var(--soft)}
.row .main{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.row .sub{font-size:12.5px;color:var(--ink2);margin-top:2px;overflow-wrap:anywhere}
.row .end{display:flex;align-items:center;gap:8px;flex:none}
.chev{color:var(--ink3);flex:none}
.okbtn{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--green);background:var(--green-bg);color:var(--green);display:grid;place-items:center;flex:none}
.okbtn:active{background:var(--green);color:#fff}
.code{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--ink2);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.empty{padding:22px 16px;text-align:center;color:var(--ink2);font-size:14px}

/* ---------- nhãn trạng thái ---------- */
.pill{display:inline-flex;flex-direction:column;align-items:flex-end;justify-content:center;border-radius:9px;padding:4px 9px;font-size:12px;font-weight:600;line-height:1.2;white-space:nowrap;text-align:right}
.pill .zi{margin:0;font-weight:500;font-size:11px;color:inherit;opacity:.85}
.p-qua{background:var(--red-bg);color:var(--red)}
.p-nay{background:var(--orange-bg);color:var(--orange)}
.p-sap{background:var(--blue-bg);color:var(--blue)}
.p-ok{background:var(--soft);color:var(--ink2)}
.p-xong{background:var(--green-bg);color:var(--green)}
.p-cho{background:var(--orange-bg);color:var(--orange)}
.p-huy{background:var(--soft);color:var(--ink3)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600}

/* ---------- trang chủ ---------- */
.today{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:2px 0 14px}
.today .d{font-size:22px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.today .w{color:var(--ink2);font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:86px}
.tile b{font-size:30px;line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;font-weight:600;color:var(--ink)}
.tile .zi{font-weight:500}
.tile.t-qua b{color:var(--red)} .tile.t-nay b{color:var(--orange)} .tile.t-sap b{color:var(--blue)} .tile.t-xong b{color:var(--green)}
.tile.t-qua.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.tile.zero b{color:var(--ink3)}
.cta{margin-top:12px;width:100%;border:0;border-radius:14px;background:var(--yellow);color:var(--onyellow);display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;font-weight:700;font-size:16px;box-shadow:var(--shadow)}
.cta .ic{width:44px;height:44px;border-radius:11px;background:#16211F;color:var(--yellow);display:grid;place-items:center;flex:none}
.cta .zi{display:block;margin:0;color:#3D4A47;font-weight:500;font-size:13px}

/* ---------- nút, ô nhập ---------- */
.btn{display:inline-flex;flex-wrap:wrap;white-space:nowrap;text-decoration:none;align-items:center;justify-content:center;gap:0 8px;border:0;border-radius:11px;padding:11px 16px;font-weight:600;font-size:15px;background:var(--navy);color:#fff;min-height:46px;text-align:center}
.btn .zi{color:inherit;opacity:.8}
.btn.bl{flex-direction:column;gap:0;line-height:1.25}
.btn.y{background:var(--yellow);color:var(--onyellow)}
.btn.g{background:var(--green);color:#fff}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:var(--red);border:1px solid var(--red)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1 1 140px}
.fld{display:block;margin:0 0 14px}
.fld>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.fld>span .zi{font-weight:500;font-size:12px}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:11px 12px;font-size:16px;min-height:46px}
.login .zi{color:var(--onnavy2)}
.login .err{line-height:1.45;text-align:left}
#apiIn{word-break:break-all;resize:none}
textarea.inp{min-height:76px;resize:vertical}
.inp:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.help{font-size:12.5px;color:var(--ink2);margin-top:6px}
.err{color:var(--red);font-size:13.5px;font-weight:600;margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on .zi{color:#C9D4D1}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.searchbox .inp{padding-left:40px}
.switch{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.switch:first-child{border-top:0}
.switch .t{flex:1}
.switch input{appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--green)}
.switch input:checked::after{left:23px}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.stepper b{min-width:120px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- chi tiết máy ---------- */
.mhead{padding:16px}
.mhead h1{margin:6px 0 2px;font-size:21px;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.mhead .p2{color:var(--ink2);font-family:var(--f-zh)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;margin:0}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.kv dd .zi{font-weight:400}
.due{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.due .big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.due .lbl{font-size:12.5px;color:var(--ink2)}
.pre{white-space:pre-wrap;font-size:14px;margin:0}
.dates{display:flex;flex-wrap:wrap;gap:6px}
.dates span{font-family:var(--f-mono);font-size:12.5px;background:var(--blue-bg);color:var(--blue);border-radius:7px;padding:3px 8px}
.hrow{display:flex;gap:12px;padding:11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;align-items:flex-start}
.hrow:first-child{border-top:0}
.hrow .dd{font-family:var(--f-mono);font-weight:700;font-size:13px;min-width:48px;padding-top:1px}
.hrow .dd small{display:block;font-weight:500;color:var(--ink3);font-size:11px}
.hrow .main{flex:1;min-width:0}
.hrow.huy .nm,.hrow.huy .dd{text-decoration:line-through;color:var(--ink3)}

/* ---------- lịch ---------- */
.caltools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin:10px 0 12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);-webkit-overflow-scrolling:touch}
table.cal{border-collapse:separate;border-spacing:0;font-size:12px}
table.cal th,table.cal td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
table.cal thead th{position:sticky;top:0;background:var(--soft);z-index:2;font-weight:600;color:var(--ink2)}
table.cal .nmc{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;min-width:148px;max-width:180px;padding:6px 10px;font-weight:600;color:var(--ink);box-shadow:1px 0 0 var(--line)}
table.cal thead .nmc{z-index:3;background:var(--soft)}
table.cal .nmc .s{display:block;font-weight:400;font-size:11px;color:var(--ink3)}
table.cal .nmc button{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:12.5px;line-height:1.3;overflow-wrap:anywhere}
table.cal tr.grp th,table.cal tr.grp td{background:var(--bg)}
table.cal tr.grp th.nmc{background:var(--bg);font-size:12px;color:var(--ink2);font-weight:700;letter-spacing:.02em}
.yr td{min-width:62px;padding:5px 4px;vertical-align:middle}
.yr thead th.m{padding:6px 4px;min-width:62px}
.yr thead th.m button{border:0;background:none;font-weight:700;font-size:12.5px;line-height:1.2;color:var(--ink)}
.yr thead th.m button small{display:block;font-family:var(--f-zh);font-weight:500;color:var(--ink3)}
.yr .cur{background:var(--today)}
.cells{display:flex;flex-wrap:wrap;gap:3px}
.c{display:inline-grid;place-items:center;min-width:22px;height:20px;border-radius:5px;font-family:var(--f-mono);font-size:11px;font-weight:700;border:0;padding:0 3px}
.c-xong{background:var(--green);color:#fff}
.c-qua{background:var(--red);color:#fff}
.c-nay{background:var(--orange);color:#fff}
.c-kh{background:var(--blue-bg);color:var(--blue);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue) 35%,transparent)}
.mg td{width:26px;min-width:26px;height:30px;text-align:center}
.mg thead th.d{width:26px;min-width:26px;padding:3px 0;font-size:11px;line-height:1.15}
.mg thead th.d b{display:block;font-family:var(--f-mono);font-size:12px;color:var(--ink)}
.mg thead th.d i{display:block;font-style:normal;font-size:9.5px}
.mg .wk{background:var(--wkend)}
.mg thead th.wk{background:var(--wkend)}
.mg thead th.td{background:var(--yellow);color:var(--onyellow)}
.mg thead th.td b{color:var(--onyellow)}
.mg td.td{box-shadow:inset 1px 0 0 var(--yellow),inset -1px 0 0 var(--yellow)}
.mg td .c{min-width:20px;height:20px;padding:0}
.agenda .day{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.agenda .day:first-child{border-top:0}
.agenda .day .dd{min-width:56px;font-family:var(--f-mono);font-weight:700;font-size:13px}
.agenda .day .dd small{display:block;font-family:var(--f-ui);font-weight:500;color:var(--ink3);font-size:11px}
.agenda .day.td{background:var(--today)}
.agenda .items{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.agenda .it{display:flex;gap:8px;align-items:center;border:0;background:none;padding:0;text-align:left;font-size:13.5px}
.agenda .it .c{flex:none}
.agenda .it span{overflow-wrap:anywhere}
.stat{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:0 0 10px}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- quét ---------- */
.reader{width:100%;max-width:420px;margin:0 auto;aspect-ratio:1/1;max-height:62vh;background:#0B0F0E;border-radius:16px;overflow:hidden;position:relative;display:grid;place-items:center;color:#AFC0BB;text-align:center;font-size:13px}
.reader video{object-fit:cover}
.reader .frame{position:absolute;inset:18%;border:3px solid var(--yellow);border-radius:14px;pointer-events:none;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.reader.idle .frame{display:none}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* ---------- bảng dưới, thông báo ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,15,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .2s ease}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 4px;font-size:18px;line-height:1.3}
.sheet h3 .zi{display:block;margin:0;font-size:14px;font-weight:500}
.sheet .who{color:var(--ink2);font-size:13.5px;margin-bottom:14px}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-bg{animation:none}}
/* ---------- ảnh đính kèm ---------- */
.anhsec{margin-top:14px}
.anhgrp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.anhbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1.5px dashed var(--line,#cfd6d4);border-radius:10px;background:transparent;color:var(--ink,#22302d);font-size:13px;font-weight:600;cursor:pointer}
.anhbtn small{font-weight:500;color:var(--ink2)}
.anhgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin-top:8px}
.anhcell{position:relative;width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft,#f1f3f2)}
.anhcell img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.anhcell .adel{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.anhcell .atag{position:absolute;left:3px;bottom:3px;padding:1px 6px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:600}
.anhds{width:42px;height:42px;border-radius:9px;overflow:hidden;background:var(--soft);flex:none;position:relative;cursor:pointer;border:0;padding:0}
.anhds img{width:100%;height:100%;object-fit:cover;display:block}
.anhds .acap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink3,#9aa7a3);font-size:22px;border:1.5px dashed var(--line);border-radius:9px;background:var(--card)}
.anhds .ax{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;border:0;font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.lkimg{width:32px;height:32px;border-radius:7px;object-fit:cover;margin-right:9px;flex:none;align-self:center;background:var(--soft)}
.lkimgbig{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#0b0f0e;margin-bottom:10px;display:block}
.anhview{background:#0b0f0e;color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:600;z-index:80;max-width:min(92vw,480px);box-shadow:0 6px 24px rgba(0,0,0,.25);text-align:center}
.toast .zi{color:#C9D4D1;font-weight:500}
.toast.bad{background:var(--red);color:#fff}
.toast.bad .zi{color:#FFE3DF}

/* ---------- thanh dưới ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h);align-items:center}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;color:var(--ink3);padding:4px 0;line-height:1.15}
.tab small{font-family:var(--f-zh);font-weight:500;font-size:10px}
.tab.on{color:var(--ink)}
.tab.on svg{color:var(--ink)}
.tab .sc{width:54px;height:54px;border-radius:17px;background:var(--yellow);color:#16211F;display:grid;place-items:center;margin-top:-22px;box-shadow:0 4px 14px rgba(22,33,31,.25);border:3px solid var(--card)}
.badge{position:absolute;margin:-4px 0 0 18px;background:var(--red);color:#fff;border-radius:9px;min-width:18px;height:18px;font-size:11px;display:grid;place-items:center;padding:0 5px;font-family:var(--f-mono)}
.tabic{position:relative;display:grid;place-items:center;height:24px}

/* ---------- đăng nhập ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:48px 16px 24px;background:var(--navy);color:#fff}
.login .brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.login .brand svg{width:76px;height:76px}
.login h1{margin:4px 0 0;font-size:24px;letter-spacing:-.01em}
.login h1 small{display:block;font-family:var(--f-zh);font-size:16px;font-weight:500;color:var(--onnavy2);margin-top:2px}
.login .lbl{margin:26px 0 12px;color:var(--onnavy2);font-size:14px;text-align:center}
.dots{display:flex;gap:14px;justify-content:center;margin-bottom:10px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #6E807B}
.dots i.f{background:var(--yellow);border-color:var(--yellow)}
.pad{padding:14px 16px}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center;margin-top:14px}
.keypad button{height:64px;border-radius:18px;border:0;background:var(--navy2);color:#fff;font-size:24px;font-weight:600;font-family:var(--f-mono)}
.keypad button:active{background:#314441}
.keypad button.fn{background:none;font-size:14px;font-family:var(--f-ui);color:var(--onnavy2)}
.login .err{color:#FF9C92;text-align:center;min-height:22px}
.login .hint{margin-top:22px;font-size:12.5px;color:var(--onnavy2);text-align:center;max-width:320px}
.login .ver{margin-top:auto;padding-top:24px;font-size:12px;color:#6E807B;font-family:var(--f-mono)}
.login .stripe{position:fixed;left:0;right:0;top:0}

/* ---------- tem QR ---------- */
.lblprev{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.qlabel{background:#fff;color:#16211F;border:1px dashed #B9C3C0;border-radius:8px;display:flex;gap:10px;align-items:center;padding:8px;overflow:hidden}
.qlabel svg{flex:none;width:92px;height:92px}
.qlabel .ti{min-width:0;display:flex;flex-direction:column;gap:3px}
.qlabel .cd{font-family:var(--f-mono);font-weight:700;font-size:13px}
.qlabel .nm{font-weight:700;font-size:13px;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qlabel .ck{font-size:11px;color:#3D4A47}
.qlabel .hn{font-size:9.5px;color:#55625F;line-height:1.25}
.checkrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.checkrow:first-child{border-top:0}
.checkrow input{width:22px;height:22px;flex:none;accent-color:var(--navy)}
#printArea{display:none}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  @page{size:A4;margin:0}
  .psheet{width:210mm;height:297mm;display:grid;page-break-after:always;break-after:page;overflow:hidden}
  .psheet:last-child{page-break-after:auto;break-after:auto}
  .psheet.s24{grid-template-columns:repeat(3,70mm);grid-auto-rows:37.125mm}
  .psheet.s8{grid-template-columns:repeat(2,105mm);grid-auto-rows:74.25mm}
  .pl{display:flex;align-items:center;gap:2.5mm;padding:2.5mm 3mm;overflow:hidden;color:#000;font-family:var(--f-ui)}
  .s24 .pl svg{width:30mm;height:30mm;flex:none}
  .s8 .pl{flex-direction:column;align-items:stretch;padding:4mm 5mm;gap:2mm}
  .s8 .pl .hz{height:4mm;background:repeating-linear-gradient(-45deg,#F5C400 0 3mm,#000 3mm 6mm);-webkit-print-color-adjust:exact;print-color-adjust:exact}

// ===== XW: ghi file Excel .xlsx có màu, không cần thư viện ngoài =====
// XW.build([{name, rows:[[cell]], cols:[width], merges:['A1:C1'], freeze:{r,c}, heights:{1:28}, landscape}])
// cell: null | 'chữ' | số | {v, s:{b, sz, color, fill, align, valign, wrap, border, fmt, i}}
const XW = (() => {
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
  const col = (n) => { let s = ''; n += 1; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const argb = (c) => 'FF' + String(c).replace('#', '').toUpperCase();

  function Styles() {

async function api(action, payload, opts) {
  opts = opts || {};
  const req = { action, payload: payload || {}, token: S.tk, device: DEV };
  if (opts.opId) req.opId = opts.opId;
  let j;
  if (IS_DEMO) {
    await sleep(120 + Math.random() * 180);
    if (S.simOff) throw { code: 'MANG' };
    j = DemoBackend.call(req);
  } else {
    const url = apiUrl();
    if (!url) throw { code: 'CHUA_CAI' };
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), (opts.timeout || (action === 'data' ? 45 : 30)) * 1000);
    try {
      let txt;
      try {
        const res = await fetch(url, { method: 'POST', body: JSON.stringify(req), signal: ctrl.signal, redirect: 'follow' });
        txt = await res.text();
      } catch (e) { throw { code: 'MANG' }; }
      try { j = JSON.parse(txt); } catch (e) {
        // Trả về trang HTML thay vì dữ liệu: đoán nguyên nhân để báo rõ
        if (/doPost/i.test(txt)) throw { code: 'CHUA_CODE' };
        if (/accounts\.google\.com|ServiceLogin|signin/i.test(txt)) throw { code: 'CAN_QUYEN' };
        throw { code: 'MANG' };
      }
    } finally { clearTimeout(to); }
  }
  if (!j || !j.ok) {
    const e = { code: (j && j.code) || 'LOI', message: j && j.message };
    if (e.code === 'HET_PHIEN' && action !== 'login') { setTimeout(() => logout(true), 0); }
    throw e;
  }
  if (S.offline) setOffline(false);
  return j.data;
}

}
async function flush() {
  if (!S.me) return;
  if (S.flushing) { S.flushAgain = true; return; }
  S.flushing = true; S.flushAgain = false;
  let changed = false;
  try {
    for (const q of S.Q.filter((x) => x.st === 'cho' && x.uid === S.me.id)) {
      try {
        const d = await api(q.action, q.p, { opId: q.opId });
        mergeResult(d); S.Q = S.Q.filter((x) => x !== q); changed = true;
      } catch (e) {
        if (e.code === 'MANG') { setOffline(true); break; }
        if (e.code === 'HET_PHIEN') break;
        q.st = 'loi'; q.err = { code: e.code, message: e.message || '' }; changed = true;

  } finally {
    S.flushing = false;

}
function mergeResult(d) {

}

    const newest = !last || q.p.ngay > last;

function planFor(m, y, today) {

  (S.V.lsMa[m.ma] || []).forEach((x) => { if (x.ngay.slice(0, 4) === y) out.set(x.ngay, 'xong'); });
  if (m.hoatDong && m.hanKeTiep && m.chuKy > 0) {

    const end = y + '-12-31';
    let d = addD(h < today ? today : h, m.chuKy), guard = 0;

async function startScan() {
  try { await loadScript(LIB.h5q); } catch (e) { camFail(); return; }
  if (!$('#qrv') || S.scanner) return;
  let sc;
  try { sc = new Html5Qrcode('qrv', { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE], verbose: false }); } catch (e) { camFail(); return; }
  S.scanner = sc;
  try {
    await sc.start({ facingMode: 'environment' }, { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.64); return { width: s, height: s }; } }, onScan, () => {});
    if (S.scanner !== sc) { sc.stop().then(() => sc.clear()).catch(() => {}); return; }
    const r = $('#reader'); if (r) r.classList.remove('idle');
    const cm = $('#camMsg'); if (cm) cm.hidden = true;
  } catch (e) { if (S.scanner === sc) S.scanner = null; camFail(); }
}
function camFail() { const cm = $('#camMsg'); if (cm) { cm.hidden = false; cm.innerHTML = t('camFail'); } }
function stopScan() {
  const sc = S.scanner; S.scanner = null;
  if (sc) { try { sc.stop().then(() => sc.clear()).catch(() => {}); } catch (e) { /* bỏ qua */ } }
}
function parseCode(text) {
  let s = String(text || '').trim();
  try { const u = new URL(s); const m = u.searchParams.get('m'); if (m) s = m; } catch (e) { /* không phải link */ }
  s = s.replace(/^BD[:\-]/i, '').trim().toUpperCase();
  return S.V.byMa[s] || S.V.ctByMa[s] ? s : null;
}
function onScan(text) {
  if (S.scanBusy) return;
  S.scanBusy = true; setTimeout(() => { S.scanBusy = false; }, 1500);
  const ma = parseCode(text);
  if (!ma) { toast(t('qrUnknown') + '<br><span class="mono">' + esc(String(text).slice(0, 60)) + '</span>', true); return; }
  try { navigator.vibrate && navigator.vibrate(60); } catch (e) { /* bỏ qua */ }
  stopScan();
  if (S.V.ctByMa[ma]) go('dienNhap', { ma }); else go('may', { ma, xn: true });
}
async function scanFromFile(e) {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    await loadScript(LIB.h5q);

  } catch (x) { toast(t('qrNone'), true); }
}

function appLink() { return location.origin + location.pathname; }
function qrText(ma) { return IS_DEMO || !/^https?:/.test(location.protocol) ? ma : appLink() + '?m=' + encodeURIComponent(ma); }
function qrSvg(text) {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), qz = 2; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + (c + qz) + ' ' + (r + qz) + 'h1v1h-1z';
  return `<svg viewBox="0 0 ${n + qz * 2} ${n + qz * 2}" shape-rendering="crispEdges" role="img" aria-label="QR ${esc(text)}"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function labelInner(m, big) {
  const ct = S.V.ctByMa[m.ma] === m;
  const info = ct ? `${esc(tv('heSo'))} ×${fmtNum(m.heSo, 'raw')}${m.soCongTo ? ' · ' + esc(m.soCongTo) : ''}`
    : `${esc(tv('cycle'))} ${m.chuKy} ${esc(tv('days', { n: '' }).trim())} · ${esc(tz('cycle'))}${m.chuKy}${esc(tz('days', { n: '' }))}`;
  const hint = ct ? 'lblDien' : 'lblScan';
  const body = `${qrSvg(qrText(m.ma))}<div class="ti"><div class="cd">${esc(m.ma)}</div><div class="nm">${esc(m.ten)}</div>
    <div class="ck">${info}</div>
    <div class="hn">${esc(tv(hint))}<br>${esc(tz(hint))}</div></div>`;
  return big ? `<div class="hz"></div><div class="bd">${body}</div>` : body;
}

function excelSerial(d) { return (Date.parse(d + 'T00:00:00Z') - Date.UTC(1899, 11, 30)) / 864e5; }
function buildWorkbook(y) {
  const today = TODAY(), list = activeMay(), ordered = [];
  byGroup(list).forEach(([, a]) => a.forEach((m) => ordered.push(m)));
  const B = { border: true };
  const H = { b: 1, fill: '#16211F', color: '#FFFFFF', align: 'center', valign: 'center', wrap: 1, border: '#5B6B67' };
  const COLORS = { xong: '#70AD47', nay: '#ED7D31', qua: '#D63B2F', kh: '#4472C4' };
  const days = [];
  for (let d = y + '-01-01'; d <= y + '-12-31'; d = addD(d, 1)) days.push(d);
  const FIX = 7;
  // --- Trang 1: lịch năm tô màu ---
  const rows = [], merges = [];
  const r1 = [{ v: tv('xlsTitle', { y }) + ' · ' + tz('xlsTitle', { y }), s: { b: 1, sz: 14 } }];
  const r2 = [{ v: tp('xlsExported') + ': ' + fmtD(today), s: { i: 1, color: '#55625F' } }];
  const LG = (k, sym) => ({ v: sym + tp(k), s: { fill: COLORS[k === 'st_xong' ? 'xong' : k === 'st_nay' ? 'nay' : k === 'st_qua' ? 'qua' : 'kh'], color: '#FFFFFF', b: 1, align: 'center' } });
  const r2b = [];
  r2[3] = LG('st_xong', '✓ '); r2[4] = LG('st_nay', '! '); r2[5] = { v: '', s: r2[4].s }; r2[6] = { v: '', s: r2[4].s };
  r2b[3] = LG('st_kh', ''); r2b[4] = LG('st_qua', '! '); r2b[5] = { v: '', s: r2b[4].s }; r2b[6] = { v: '', s: r2b[4].s };
  rows.push(r1, r2, r2b);
  merges.push('A1:G1', 'A2:C2', 'E2:G2', 'E3:G3');
  const hdr = [tp('stt'), tp('code'), tp('name'), tp('group'), tv('cycle') + ' (' + tv('days', { n: '' }).trim() + ')\n' + tz('cycle') + '(天)', tp('lastDone').replace(' · ', '\n'), tp('nextDue').replace(' · ', '\n')];
  const r4 = hdr.map((h) => ({ v: h, s: H })), r5 = hdr.map(() => ({ v: '', s: H })), r6 = hdr.map(() => ({ v: '', s: H }));
  for (let i = 0; i < FIX; i++) merges.push(XW.col(i) + '4:' + XW.col(i) + '6');
  let mStart = FIX;
  days.forEach((d, i) => {
    const c = FIX + i, w = wday(d), wk = w === 0 || w === 6, isT = d === today;
    const mo = +d.slice(5, 7);
    if (d.slice(8) === '01') mStart = c;
    r4[c] = { v: d.slice(8) === '01' ? 'Tháng ' + mo + ' · ' + mo + '月' : '', s: H };
    if (i === days.length - 1 || days[i + 1].slice(8) === '01') merges.push(XW.col(mStart) + '4:' + XW.col(c) + '4');
    const base = { align: 'center', border: true, sz: 8 };
    r5[c] = { v: WD_VI[w] + ' ' + WD_ZH[w], s: Object.assign({}, base, isT ? { fill: '#F5C400', b: 1 } : wk ? { fill: '#FFF2F2', color: '#C0392B' } : { fill: '#F3F5F4' }) };
    r6[c] = { v: excelSerial(d), s: Object.assign({}, base, { fmt: 'd', b: 1, sz: 9 }, isT ? { fill: '#F5C400' } : wk ? { fill: '#FFF2F2', color: '#C0392B' } : { fill: '#F3F5F4' }) };
  });
  rows.push(r4, r5, r6);
  ordered.forEach((m, i) => {
    const pl = planFor(m, y, today), last = (S.V.lsMa[m.ma] || [])[0];
    const r = [{ v: i + 1, s: Object.assign({ align: 'center' }, B) }, { v: m.ma, s: B }, { v: m.ten, s: Object.assign({ b: 1 }, B) }, { v: m.nhom, s: B },
      { v: m.chuKy, s: Object.assign({ align: 'center' }, B) },
      last ? { v: excelSerial(last.ngay), s: Object.assign({ fmt: 'dd/mm/yyyy', align: 'center' }, B) } : { v: '', s: B },
      { v: excelSerial(m.hanKeTiep), s: Object.assign({ fmt: 'dd/mm/yyyy', align: 'center', b: 1 }, B) }];
    days.forEach((d, j) => {
      const k = pl.get(d), w = wday(d);
      if (k) r[FIX + j] = { v: k === 'xong' ? '✓' : k === 'kh' ? '' : '!', s: { fill: COLORS[k], color: '#FFFFFF', b: 1, align: 'center', border: '#FFFFFF', sz: 9 } };
      else r[FIX + j] = { v: '', s: { fill: (w === 0 || w === 6) ? '#FFF2F2' : undefined, border: '#E3E8E6' } };
    });
    rows.push(r);
  });
  const cols = [5, 7, 30, 24, 11, 11, 11].concat(days.map(() => 3.6));
  const s1 = { name: 'Lịch năm ' + y + ' · 年度计划', rows, cols, merges, freeze: { r: 6, c: FIX }, heights: { 1: 24, 2: 17, 3: 17, 4: 30, 5: 16, 6: 16 }, landscape: 1,
    fit: { w: 0, h: 1 }, printTitles: { cols: 'A:G', rows: '4:6' } };
  // --- Trang 2: nhắc nhở hôm nay ---
  const r2s = [[{ v: tp('t_home') + ' — ' + fmtD(today), s: { b: 1, sz: 14 } }], []];
  const h2 = [tp('stt'), tp('code'), tp('name'), tp('group'), tp('cycle'), tp('lastDone'), tp('performer'), tp('nextDue'), tp('xRemain'), tp('xStatus')];
  r2s.push(h2.map((h) => ({ v: h, s: H })));
  const ST_FILL = { qua: ['#FBE8E5', '#C8372D'], nay: ['#FDEEDF', '#D96A12'], sap: ['#E4ECF9', '#2F62B8'], ok: [null, '#16211F'] };
  ordered.slice().sort((a, b) => (a.hanKeTiep > b.hanKeTiep ? 1 : a.hanKeTiep < b.hanKeTiep ? -1 : 0)).forEach((m, i) => {
    const st = stOf(m, today), last = (S.V.lsMa[m.ma] || [])[0], f = ST_FILL[st.k] || ST_FILL.ok;
    const lbl = st.k === 'qua' ? tp('d_qua', { n: -st.d }) : st.k === 'nay' ? tp('d_nay') : st.k === 'sap' ? tp('st_sap') : tp('st_ok');
    r2s.push([{ v: i + 1, s: Object.assign({ align: 'center' }, B) }, { v: m.ma, s: B }, { v: m.ten, s: Object.assign({ b: 1 }, B) }, { v: m.nhom, s: B },
      { v: m.chuKy, s: Object.assign({ align: 'center' }, B) },
      last ? { v: excelSerial(last.ngay), s: Object.assign({ fmt: 'dd/mm/yyyy', align: 'center' }, B) } : { v: '', s: B },
      { v: last ? last.nguoi : '', s: B },
      { v: excelSerial(m.hanKeTiep), s: Object.assign({ fmt: 'dd/mm/yyyy', align: 'center', b: 1 }, B) },
      { v: st.d, s: Object.assign({ align: 'center' }, B) },
      { v: lbl, s: { fill: f[0] || undefined, color: f[1], b: 1, border: true } }]);
  });
  const s2 = { name: 'Nhắc nhở · 提醒', rows: r2s, cols: [5, 7, 32, 22, 8, 12, 24, 12, 10, 24], merges: ['A1:J1'], freeze: { r: 3 }, heights: { 1: 24, 3: 30 }, landscape: 1, printTitles: { rows: '3:3' } };
  // --- Trang 3: lịch sử trong năm ---
  const r3 = [[{ v: tp('t_hist') + ' ' + y, s: { b: 1, sz: 14 } }], []];
  const h3 = [tp('dateDone'), tp('code'), tp('name'), tp('group'), tp('performer'), tp('note'), tp('dueWas'), tp('xOnTime'), tp('confirmedBy'), tp('savedAt'), tp('xStatus'), tp('ktHead'), tp('soHead'), tp('lkUsed')];
  r3.push(h3.map((h) => ({ v: h, s: H })));
  S.V.ls.filter((x) => x.ngay.slice(0, 4) === String(y)).sort((a, b) => (a.ngay > b.ngay ? -1 : a.ngay < b.ngay ? 1 : 0)).forEach((x) => {
    const m = S.V.byMa[x.ma], huy = x.trangThai === 'HUY';
    let dl = '';
    if (x.denHan) { const d = diffD(x.ngay, x.denHan); dl = d > 0 ? tp('late', { n: d }) : d < 0 ? tp('early', { n: -d }) : tp('onTime'); }
    const st = Object.assign({}, B, huy ? { color: '#86928F' } : {});
    r3.push([{ v: excelSerial(x.ngay), s: Object.assign({ fmt: 'dd/mm/yyyy', align: 'center' }, st) }, { v: x.ma, s: st }, { v: m ? m.ten : x.tenMay, s: st },
      { v: m ? m.nhom : '', s: st }, { v: x.nguoi, s: st }, { v: x.ghiChu, s: Object.assign({ wrap: 1 }, st) },
      x.denHan ? { v: excelSerial(x.denHan), s: Object.assign({ fmt: 'dd/mm/yyyy', align: 'center' }, st) } : { v: '', s: st },
      { v: dl, s: st }, { v: x.xacNhan, s: st }, { v: x.thoiGian, s: st },
      { v: huy ? tp('cancelled') + (x.huy ? ' — ' + x.huy : '') : x.cho ? tp('pending') : 'OK', s: st },
      { v: ctText(x.chiTiet, 'kt'), s: Object.assign({ wrap: 1 }, st, x.chiTiet && (x.chiTiet.kt || []).some((h) => h.kq === 'LOI') && !huy ? { color: '#C8372D' } : {}) },
      { v: ctText(x.chiTiet, 'so'), s: Object.assign({ wrap: 1 }, st) }, { v: ctText(x.chiTiet, 'lk'), s: Object.assign({ wrap: 1 }, st) }]);
  });

  return XW.build([s1, s2, s3].concat(lkSheets(y)));
}

async function saveFile(blob, name) {

    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }

    catch (e) { if (!e || e.code !== 'declined') toast(t('fileFail'), true); }
    return;
  }
  const url = URL.createObjectURL(blob);
  let file = null, canShare = false;
  try { file = new File([blob], name, { type: blob.type }); canShare = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { canShare = false; }
  S.shareFile = file;
  openSheet(`<div class="grab"></div><h3>${tv('fileReady')}<span class="zi">${tz('fileReady')}</span></h3>
    <div class="who mono">${esc(name)} · ${Math.max(1, Math.round(blob.size / 1024))} KB</div>
    <p class="help" style="margin:-4px 0 14px">${t('exportWhat')}</p>
    <div class="btns"><a class="btn" id="dlLink" href="${url}" download="${esc(name)}">${IC.dl} ${t('download')}</a>

}

function anhSrc(a) {
  if (!a) return '';
  if (typeof a === 'string') {
    if (a.indexOf('data:') === 0) return a;
    return 'https://drive.google.com/uc?export=view&id=' + encodeURIComponent(a);
  }
  if (a.data) return a.data;
  if (a.id) return 'https://drive.google.com/uc?export=view&id=' + encodeURIComponent(a.id);
  return '';
}
function imgCompress(file, maxPx, maxKb) {
  return new Promise(function (resolve, reject) {
    const rd = new FileReader();
    rd.onload = function () {
      const im = new Image();
      im.onload = function () {
        let w = im.width, h = im.height;
        if (w > maxPx || h > maxPx) { const sc = maxPx / Math.max(w, h); w = Math.round(w * sc); h = Math.round(h * sc); }
        const cv = document.createElement('canvas'); cv.width = Math.max(1, w); cv.height = Math.max(1, h);
        const ctx = cv.getContext('2d'); ctx.drawImage(im, 0, 0, w, h);
        let q = 0.72, out = cv.toDataURL('image/jpeg', q);
        while (out.length > maxKb * 1370 && q > 0.32) { q -= 0.08; out = cv.toDataURL('image/jpeg', q); }
        resolve(out);
      };
      im.onerror = function () { reject(new Error('img')); };
      im.src = rd.result;
    };
    rd.onerror = function () { reject(new Error('read')); };
    rd.readAsDataURL(file);
  });
}

function fmtNum(v, dec) {

        ${can('may') ? `<div class="btns" style="justify-content:center;margin-top:14px"><button class="btn sm" data-act="ctEdit" data-ma="">${IC.plus} ${t('addCT')}</button>${can('admin') ? `<button class="btn ghost sm" data-act="go" data-v="thongSo">${t('paramsBtn')}</button>` : ''}</div>` : ''}</div>`;

function dienGhi() {

        <div class="sub">${esc(x.nguoi)} · ${esc((x.thoiGian || '').slice(5, 16))}</div>`;
    } else pl = `<span class="pill ${k === today ? 'p-nay' : k < today ? 'p-qua' : 'p-ok'}">${t('chuaGhi')}</span>`;
    return `<div class="row" data-act="dienNhap" data-ma="${esc(c.ma)}" data-ky="${k}" role="button" tabindex="0">

}

function bangHa(y, kys) {

      h += `<td class="num tot"><b>${tot === null ? '' : fmtNum(tot)}</b></td></tr>`;

      h += `<td class="num mono${x ? '' : ' miss'}"><button class="cellbtn" data-act="dienNhap" data-ma="${esc(c.ma)}" data-ky="${k}">${v === undefined ? (x ? '' : `<span class="muted">${esc(tv('chuaGhi'))}</span>`) : fmtNum(v, 'raw')}</button>${x && x.cho ? '<sup>⏳</sup>' : ''}</td>
        <td class="num${dd && dd.am ? ' bad' : ''}">${dd ? fmtNum(dd.v) + (dd.gap ? '<sup>*</sup>' : '') : ''}</td>`;

// Bảng theo tháng như sổ ghi Excel: mỗi công tơ một dòng; chỉ số cuối tháng trước, ngày 10, 20, cuối tháng; tiêu thụ từng kỳ và cả tháng
// "Tên Việt · 中文名" → [Việt, Trung]
function splitTen(t) { const i = String(t).indexOf(' · '); return i < 0 ? [t, ''] : [t.slice(0, i), t.slice(i + 3)]; }
function thangMacDinh(l) {
  const cur = kyHienTai(TODAY()), ms = S.V.ct.filter((c) => ctLoai(c) === l).map((c) => c.ma);
  let best = '';
  ms.forEach((ma) => (S.V.csMa[ma] || []).forEach((x) => { if (x.ky <= cur && x.ky.slice(0, 7) > best) best = x.ky.slice(0, 7); }));
  return best || cur.slice(0, 7);
}
function bangThang(l) {
  const f = S.f, cur = kyHienTai(TODAY());
  if (!f.dYM || f.dYM > cur.slice(0, 7)) f.dYM = thangMacDinh(l);
  const ym = f.dYM, y = +ym.slice(0, 4), m = +ym.slice(5, 7), kE = kyDate(y, m, dim(y, m));
  const kys = [kyTruoc(kyDate(y, m, 10)), kyDate(y, m, 10), kyDate(y, m, 20), kE];
  // công tơ đã ngừng chỉ hiện ở tháng còn có số
  const list = shownLoai(l, y).filter((c) => c.hoatDong || kys.slice(1).some((k) => S.V.csKey[c.ma + '|' + k])), has = shownLoai('ha', y);
  let o = `<div class="caltools"><div class="stepper"><button data-act="dYM" data-d="-1" aria-label="-">${IC.left}</button><b>${esc(tv('monthYM', { m, y }))}<small style="display:block;font-family:var(--f-zh);font-weight:500;color:var(--ink2);font-size:12px">${esc(tz('monthYM', { m, y }))}</small></b><button data-act="dYM" data-d="1" aria-label="+" ${ym >= cur.slice(0, 7) ? 'disabled' : ''}>${IC.right}</button></div>
    <button class="btn ghost sm" data-act="exportDien" data-y="${y}">${IC.dl} ${t('exportDien')}</button></div>`;
  if (!list.length) return o + `<div class="card empty">${t('noData')}</div>`;
  const rng = [`1–10`, `11–20`, `21–${dim(y, m)}`];
  let h = `<p class="help" style="margin:-4px 0 10px">${esc(tp('tieuThu'))} = (${esc(tp('csHa'))} − ${esc(tp('kyTruoc'))}) × ${esc(tp('heSo'))}</p>
    <div class="tblwrap dtabwrap"><table class="cal dtab mtab"><thead><tr><th class="nmc" rowspan="2">${t('congTo')}</th>
    <th colspan="4" class="pc">${t('csNgay')}</th><th colspan="4" class="pc tot">${t('ttKwh')}</th></tr><tr>`;
  kys.forEach((k) => { h += `<th class="sub2 mono">${fmtDM(k)}</th>`; });
  rng.forEach((r) => { h += `<th class="sub2 mono">${r}</th>`; });
  h += `<th class="sub2 tot">${t('caThang')}</th></tr></thead><tbody>`;
  let anyGap = false;
  const consCell = (d) => { if (!d) return '<td class="num"></td>'; if (d.gap) anyGap = true; return `<td class="num${d.am ? ' bad' : ''}">${fmtNum(d.v)}${d.gap ? '<sup>*</sup>' : ''}</td>`; };
  list.forEach((c) => {
    const [tVi, tZh] = splitTen(c.ten);
    h += `<tr><th class="nmc"><button data-act="dienNhap" data-ma="${esc(c.ma)}" data-ky="${kE <= cur ? kE : cur}">${esc(tVi)}${tZh ? `<span class="zi" lang="zh-CN">${esc(tZh)}</span>` : ''}</button><span class="s mono">${esc(c.ma)}${c.heSo !== 1 ? ' · ×' + fmtNum(c.heSo, 'raw') : ''}${c.hoatDong ? '' : ' · ' + esc(tp('ngungCT'))}</span></th>`;
    kys.forEach((k) => {
      const x = S.V.csKey[c.ma + '|' + k], v = x && x.giaTri ? x.giaTri['1.8.0'] : undefined;
      if (k > cur) { h += '<td class="num muted">·</td>'; return; }
      h += `<td class="num mono${x ? '' : ' miss'}"><button class="cellbtn" data-act="dienNhap" data-ma="${esc(c.ma)}" data-ky="${k}">${v === undefined ? (x ? '' : `<span class="muted">—</span>`) : fmtNum(v, 'raw')}</button>${x && x.cho ? '<sup>⏳</sup>' : ''}</td>`;
    });
    kys.slice(1).forEach((k) => { h += consCell((S.V.dl[c.ma + '|' + k] || {})['1.8.0']); });
    const mv = monthCons(c.ma, y, m, '1.8.0');
    h += `<td class="num tot"><b>${mv === null ? '' : fmtNum(mv)}</b></td></tr>`;
  });
  const sumRow = (label, ll, cls) => {
    let r = `<tr class="mt${cls ? ' ' + cls : ''}"><th class="nmc">${label}</th><td colspan="4"></td>`;
    kys.slice(1).forEach((k) => { const d = kyCons('ALL', k, ll); r += `<td class="num"><b>${d ? fmtNum(d.v) : ''}</b></td>`; });
    const tv0 = consSel('ALL', y, m, null, ll);
    return r + `<td class="num tot"><b>${tv0 === null ? '' : fmtNum(tv0)}</b></td></tr>`;
  };
  h += sumRow(t(LOAI_TONG[l]), l);
  if (l === 'nhanh' && has.length) {
    h += sumRow(t('tongHa'), 'ha');
    let r = `<tr class="mt chl"><th class="nmc">${t('chenhLech')}<span class="s">${esc(tv('chenhHNNote'))}</span></th><td colspan="4"></td>`;
    kys.slice(1).forEach((k) => { const a = kyCons('ALL', k, 'ha'), b = kyCons('ALL', k, 'nhanh'); r += `<td class="num">${a && b ? fmtNum(a.v - b.v) : ''}</td>`; });
    const A = consSel('ALL', y, m, null, 'ha'), B = consSel('ALL', y, m, null, 'nhanh');
    h += r + `<td class="num tot">${A && B !== null ? `<b>${fmtNum(A - B)}</b><small class="pct">${((A - B) / A * 100).toFixed(1)}%</small>` : ''}</td></tr>`;
  }
  h += '</tbody></table></div>';
  if (anyGap) h += `<p class="help" style="margin-top:8px">${t('gapNote')}</p>`;
  return o + h;
}

    ${cmp ? `<div class="card pad chartcard"><h3 class="ch">${t(cmp)} <span class="unit mono">kWh</span></h3><div class="legend" id="lg3"></div><div class="chart" id="ch3"></div><p class="help">${t(l === 'cao' ? 'chenhNote' : 'chenhHNNote')}</p></div>` : ''}
    ${l !== 'cao' ? `<div class="card pad chartcard"><h3 class="ch" id="ch4t"></h3><div id="ch4"></div></div>` : ''}`;
}
function kpiHtml(label, val, delta) {

}
function drawCharts() {
  const el1 = $('#ch1'); if (!el1) return;
  const l = curLoai(), sel = curSel(l), y = yearSel(), today = TODAY();
  const thisYear = String(y) === today.slice(0, 4);
  const labels = Array.from({ length: 12 }, (_, i) => String(i + 1)), curIdx = thisYear ? +today.slice(5, 7) - 1 : -1;
  const c = sel !== 'ALL' ? S.V.ctByMa[sel] : null, codes = c ? tsOfCT(c) : ['1.8.0'];
  // Chỉ tách 3 biểu giá khi công tơ thật sự có ghi 1.8.1–1.8.3 trong năm; không thì vẽ theo 1.8.0
  const coBieuGia = !!c && (S.V.csMa[c.ma] || []).some((x) => x.ky.slice(0, 4) === String(y) && x.giaTri && ['1.8.1', '1.8.2', '1.8.3'].some((k) => x.giaTri[k] !== undefined));
  const split = l === 'cao' && coBieuGia && ['1.8.1', '1.8.2', '1.8.3'].every((k) => codes.indexOf(k) >= 0);
  const series = split ? ['1.8.1', '1.8.2', '1.8.3'].map((k, i) => ({ key: k, cls: 's' + (i + 1), name: (S.V.tsByMa[k] || {}).ten || k }))
    : [{ key: '1.8.0', cls: 's1', name: '' }];
  // 1. Theo tháng
  const data = [];
  for (let m = 1; m <= 12; m++) {
    const vals = {}; let tot = 0, has = false;
    series.forEach((s) => { const v = consSel(sel, y, m, s.key, l); if (v !== null) { vals[s.key] = Math.max(0, v); tot += Math.max(0, v); has = true; } });
    data.push(has ? { vals, total: tot } : null);
  }
  const idx = data.map((d, i) => (d ? i : -1)).filter((i) => i >= 0), lbl = [];
  if (idx.length) {
    let mx = idx[0]; idx.forEach((i) => { if (data[i].total > data[mx].total) mx = i; });
    lbl.push(mx); if (idx[idx.length - 1] !== mx) lbl.push(idx[idx.length - 1]);
  }
  $('#lg1').innerHTML = series.length > 1 ? series.map((s) => `<span><i class="sw ${s.cls}"></i>${esc(s.key)} ${esc(s.name)}</span>`).join('') : '';
  const tips = data.map((d, i) => d ? {
    title: tp('kMonth', { m: i + 1 }) + ' / ' + y,
    rows: [{ value: fmtNum(d.total) + ' kWh', name: tp('total') }].concat(series.length > 1 ? series.map((s) => ({ cls: s.cls, value: fmtNum(d.vals[s.key] || 0) + ' kWh', name: s.key + ' ' + s.name })) : [])
  } : null);
  if (!idx.length) el1.innerHTML = `<div class="empty">${t('noData')}</div>`;
  else colChart(el1, { labels, series, data, labelIdx: lbl, tips, cur: curIdx });
  // 2. Theo kỳ
  const kys = kysOfYear(y).filter((k) => k <= kyHienTai(today));
  const pts = kys.map((k) => periodPt(sel, k, l)), el2 = $('#ch2');
  if (pts.filter(Boolean).length < 2) el2.innerHTML = `<div class="empty">${t('noData')}</div>`;
  else lineChart(el2, { pts, kys });
  // KPI

function ketQuaCuoi(ma) {
  const byId = {}, byTen = {};
  (S.V.lsMa[ma] || []).forEach((x) => {
    const c = x.chiTiet; if (!c) return;
    (c.kt || []).concat(c.so || []).forEach((h) => {
      const o = Object.assign({ ngay: x.ngay }, h);
      if (!byId[h.id]) byId[h.id] = o;
      const k = norm(h.ten); if (!byTen[k]) byTen[k] = o;

}
// Thống kê linh kiện một máy từ lịch sử đã tải: theo mã linh kiện
function thongKeLK(ma) {

    const c = x.chiTiet; if (!c || !c.lk) return;
    c.lk.forEach((k) => {
      const s = st[k.id] = st[k.id] || { id: k.id, ten: k.ten, quyCach: k.quyCach, dv: k.dv, nam: {}, ds: [] };
      const y = x.ngay.slice(0, 4), n = s.nam[y] = s.nam[y] || { thay: 0, bs: 0, lan: 0 };

function ktCollect(m) {
  const f = S.ctF || { kt: {}, lk: [] };
  const hmOK = hmOf(m).filter((h) => h.kieu !== 'SO'), hmSO = hmOf(m).filter((h) => h.kieu === 'SO');
  const kt = [], so = [], lk = [];
  const miss = hmOK.filter((h) => !f.kt[h.id]);
  if (miss.length) {
    miss.forEach((h) => { const r = $(`.ktrow[data-id="${CSS.escape(h.id)}"]`); if (r) r.classList.add('miss'); });
    const r0 = $(`.ktrow[data-id="${CSS.escape(miss[0].id)}"]`); if (r0) r0.scrollIntoView({ block: 'center', behavior: 'smooth' });
    const fe = $('#fErr'); if (fe) fe.dataset.kt = '1';
    return { err: t('ktConN', { n: miss.length }) };
  }
  hmOK.forEach((h) => { const o = f.kt[h.id]; kt.push({ id: h.id, ten: h.ten, kq: o.kq, gc: o.kq === 'LOI' ? (o.gc || '').trim() : '' }); });
  for (const h of hmSO) {
    const inp = $(`[data-so="${CSS.escape(h.id)}"]`); if (!inp) continue;
    const v = parseSo(inp.value);
    if (v === null) continue;
    if (isNaN(v)) { inp.focus(); return { err: t('soSai', { m: h.ten }) }; }
    so.push({ id: h.id, ten: h.ten, v, dv: h.dv || '', min: h.min === undefined ? '' : h.min, max: h.max === undefined ? '' : h.max, vuot: vuotNguong(v, h) });
  }
  const ds = lkOf(m);
  for (const r of f.lk) {
    const sl = parseSo(r.sl);
    if (r.id === '__khac' || !ds.length) {
      const ten = (r.ten || '').trim();
      if (!ten) return { err: t('needLKTen') };
      if (!(sl > 0)) return { err: t('needSL') };
      const kx = khoGet(r.maKho);
      const co = (kx && ds.find((x) => { const g = khoGet(x.maKho); return g && g.ma === kx.ma; })) || ds.find((x) => norm(x.ten) === norm(ten));
      if (co) lk.push({ id: co.id, ten: co.ten, quyCach: co.quyCach || '', dv: co.dv || '', sl, loai: r.loai || 'THAY', maKho: co.maKho });
      else lk.push({ id: r.newId || (r.newId = newId('LK')), ten, quyCach: kx ? (r.quyCach || '') : '', dv: (r.dv || '').trim(), sl, loai: r.loai || 'THAY', maKho: kx ? kx.ma : undefined });
    } else {
      const k = ds.find((x) => x.id === r.id); if (!k) continue;
      if (!(sl > 0)) return { err: t('needSL') };
      lk.push({ id: k.id, ten: k.ten, quyCach: k.quyCach || '', dv: k.dv || '', sl, loai: r.loai || 'THAY', maKho: k.maKho });
    }
  }
  const anh = (f.anh || []).filter((a) => a && a.data).map((a) => ({ loai: a.loai || '', data: a.data })).slice(0, ANH_TOI_DA);
  return { v: kt.length || so.length || lk.length || anh.length ? { kt, so, lk, anh } : null };
}

  if (cur && cur.v === 'dsEdit' && e.target.id === 'dsCaNhom') cur.p.caNhom = e.target.checked;
});
function dsNew(k) { return k === 'hm' ? { id: newId('HM'), ten: '', kieu: 'OK' } : { id: newId('LK'), ten: '', quyCach: '', dv: '', sl: '', ghiChu: '' }; }
// Thêm các mục chưa có (so theo tên) vào danh sách đang sửa
function dsMerge(p, items) {
  const co = {}, ids = {};
  p.ds.forEach((x) => { co[norm(x.ten)] = 1; ids[x.id] = 1; });
  let n = 0;
  items.forEach((x) => {
    if (!x.ten || co[norm(x.ten)]) return;
    const o = JSON.parse(JSON.stringify(x));
    if (!o.id || ids[o.id]) o.id = newId(p.k === 'hm' ? 'HM' : 'LK');
    co[norm(o.ten)] = 1; ids[o.id] = 1; p.ds.push(o); n++;
  });
  render();
  toast(n ? t('daThemN', { n }) : t('khongMoi'), !n);
}
function dsCopySheet() {
  const p = topV().p, m = S.V.byMa[p.ma], key = p.k === 'hm' ? 'hangMuc' : 'linhKien';
  const list = S.V.may.filter((x) => x.ma !== p.ma && (x[key] || []).length)
    .sort((a, b) => ((b.nhom === m.nhom) - (a.nhom === m.nhom)) || a.ma.localeCompare(b.ma));
  openSheet(`<div class="grab"></div><h3>${tv('chonMay')}<span class="zi">${tz('chonMay')}</span></h3>
    ${list.length ? `<div class="list" style="margin-top:10px">${list.map((x) => `<button class="row" data-act="dsCopyFrom" data-ma="${esc(x.ma)}"><div class="main"><div class="nm">${esc(x.ten)}</div>
      <div class="sub"><span class="code">${esc(x.ma)}</span> · ${esc(x.nhom || '—')} · ${(x[key] || []).length} ${esc(tp(p.k === 'hm' ? 'ktHead' : 'lkHead'))}</div></div>${IC.chev}</button>`).join('')}</div>` : `<div class="card empty">${t('notFound')}</div>`}
    <div class="btns" style="margin-top:14px"><button class="btn ghost" data-act="closeSheet">${t('close')}</button></div>`);
}
function dsFromND() {
  const p = topV().p, m = S.V.byMa[p.ma];
  const items = String(m.noiDung || '').split(/\n|;|；/).map((s) => s.replace(/^\s*(?:[-•*·+]|\d+\s*[.)、:：-])\s*/, '').trim()).filter((s) => s.length > 1)
    .map((ten) => ({ id: newId('HM'), ten: ten.slice(0, 120), kieu: 'OK' }));
  dsMerge(p, items);
}
async function dsSave(el) {
  const p = topV().p, hm = p.k === 'hm';
  const fe = $('#dsErr'), show = (h) => { fe.innerHTML = h; fe.hidden = false; };
  const ds = [];
  for (const x of p.ds) {
    const ten = String(x.ten || '').trim();
    if (!ten) continue;
    if (hm) {
      const o = { id: x.id, ten, kieu: x.kieu === 'SO' ? 'SO' : 'OK' };
      if (o.kieu === 'SO') {
        const a = parseSo(x.min), b = parseSo(x.max);
        if ((a !== null && isNaN(a)) || (b !== null && isNaN(b)) || (a !== null && b !== null && a > b)) return show(t('nguongSai', { m: ten }));
        o.min = a === null ? '' : a; o.max = b === null ? '' : b; o.dv = String(x.dv || '').trim();
      }
      ds.push(o);
    } else {
      const sl = parseSo(x.sl);
      if (sl !== null && (isNaN(sl) || sl < 0)) return show(t('SO_SAI') + ' — ' + esc(ten));
      ds.push({ id: x.id, ten, quyCach: String(x.quyCach || '').trim(), dv: String(x.dv || '').trim(), sl: sl === null ? '' : sl, ghiChu: String(x.ghiChu || '').trim(), maKho: x.maKho || undefined, anh: x.anh || '', anhData: x.anhData || undefined });
    }
  }
  el.disabled = true;
  try {
    const pl = { ma: p.ma, caNhom: !!p.caNhom }; pl[hm ? 'hangMuc' : 'linhKien'] = ds;
    const d = await api('saveLists', pl);
    mergeResult(d);
    toast(t('savedN', { n: (d.dsMay || [d.may]).length }));
    back();
  } catch (e) { el.disabled = false; show(e.code === 'MANG' ? t('needNet') : errMsg(e)); }
}

// ---------- Excel: 2 trang linh kiện ----------
function lkSheets(y) {
  const H = { b: 1, fill: '#16211F', color: '#FFFFFF', align: 'center', valign: 'center', wrap: 1, border: '#5B6B67' }, B = { border: true };
  const dung = [];
  S.V.ls.filter((x) => x.trangThai !== 'HUY' && x.ngay.slice(0, 4) === String(y) && x.chiTiet && (x.chiTiet.lk || []).length)
    .sort((a, b) => (a.ngay > b.ngay ? -1 : a.ngay < b.ngay ? 1 : 0))
    .forEach((x) => x.chiTiet.lk.forEach((k) => dung.push({ x, k })));
  // Chi tiết từng lần
  const r1 = [[{ v: tv('xLKTitle', { y }) + ' · ' + tz('xLKTitle', { y }), s: { b: 1, sz: 14 } }], []];
  const h1 = [tp('dateDone'), tp('code'), tp('name'), tp('group'), tp('lkTen'), tp('quyCach'), tp('sl'), tp('dv'), tp('xLoai'), tp('performer'), tp('xStatus'), tp('maKho')];
  const mkOf = (m, k) => { const g = khoGet(k.maKho || ((lkOf(m).find((y) => y.id === k.id) || {}).maKho)); return g ? g.ma : ''; };
  r1.push(h1.map((h) => ({ v: h, s: H })));
  dung.forEach(({ x, k }) => {
    const m = S.V.byMa[x.ma];
    r1.push([{ v: excelSerial(x.ngay), s: Object.assign({ fmt: 'dd/mm/yyyy', align: 'center' }, B) }, { v: x.ma, s: B }, { v: m ? m.ten : x.tenMay, s: B }, { v: m ? m.nhom : '', s: B },
      { v: k.ten, s: Object.assign({ b: 1 }, B) }, { v: k.quyCach || '', s: B }, { v: +k.sl, s: Object.assign({ align: 'center' }, B) }, { v: k.dv || '', s: B },
      { v: tp(k.loai === 'BOSUNG' ? 'boSung' : 'thay'), s: B }, { v: x.nguoi, s: B }, { v: x.cho ? tp('pending') : 'OK', s: B }, { v: mkOf(m, k), s: B }]);
  });
  const s1 = { name: tv('xLKSheet', { y }) + ' · ' + tz('xLKSheet', { y }), rows: r1, cols: [12, 7, 30, 20, 30, 14, 8, 10, 16, 24, 14, 13], merges: ['A1:L1'], freeze: { r: 3 }, heights: { 1: 24, 3: 30 }, landscape: 1, printTitles: { rows: '3:3' } };
  // Tổng theo máy
  const r2 = [[{ v: tv('xLKTongTitle', { y }) + ' · ' + tz('xLKTongTitle', { y }), s: { b: 1, sz: 14 } }], []];
  const h2 = [tp('code'), tp('name'), tp('group'), tp('lkTen'), tp('quyCach'), tp('dv'), tp('slMay'), tp('xSLThay'), tp('xSLBS'), tp('xSoLan'), tp('ganNhat'), tp('maKho'), tp('tonKho')];
  r2.push(h2.map((h) => ({ v: h, s: H })));
  const ordered = [];
  byGroup(S.V.may).forEach(([, a]) => a.forEach((m) => ordered.push(m)));
  ordered.forEach((m) => {
    const st = thongKeLK(m.ma), ids = lkOf(m).map((k) => k.id);
    Object.keys(st).forEach((id) => { if (ids.indexOf(id) < 0) ids.push(id); });
    ids.forEach((id) => {
      const k = lkOf(m).find((x) => x.id === id) || st[id], s = st[id], n = s && s.nam[y];
      const last = s && s.ds.find((d) => d.x.ngay.slice(0, 4) <= String(y));
      if (!m.hoatDong && !n) return;
      const zero = !n, kx = khoGet(k.maKho);
      const st2 = Object.assign({}, B, zero ? { color: '#86928F' } : {});
      r2.push([{ v: m.ma, s: st2 }, { v: m.ten, s: st2 }, { v: m.nhom, s: st2 }, { v: k.ten, s: Object.assign({ b: zero ? 0 : 1 }, st2) }, { v: k.quyCach || '', s: st2 }, { v: k.dv || '', s: st2 },
        { v: k.sl === '' || k.sl === undefined || k.sl === null ? '' : +k.sl, s: Object.assign({ align: 'center' }, st2) },
        { v: n ? n.thay : 0, s: Object.assign({ align: 'center', b: n && n.thay ? 1 : 0 }, st2) }, { v: n ? n.bs : 0, s: Object.assign({ align: 'center' }, st2) },
        { v: n ? n.lan : 0, s: Object.assign({ align: 'center' }, st2) },
        last ? { v: excelSerial(last.x.ngay), s: Object.assign({ fmt: 'dd/mm/yyyy', align: 'center' }, st2) } : { v: '', s: st2 },
        { v: kx ? kx.ma : '', s: st2 }, { v: kx && tonOf(kx) !== null ? tonOf(kx) : '', s: Object.assign({ align: 'center' }, st2, kx && tonOf(kx) === 0 ? { color: '#C8372D', b: 1 } : {}) }]);
    });
  });
  const s2 = { name: tv('xLKTong', { y }) + ' · ' + tz('xLKTong', { y }), rows: r2, cols: [7, 30, 20, 30, 14, 10, 10, 10, 10, 9, 12, 13, 9], merges: ['A1:M1'], freeze: { r: 3 }, heights: { 1: 24, 3: 30 }, landscape: 1, printTitles: { rows: '3:3' } };
  return [s2, s1];
}

  lkAdd: () => {
    const f = S.ctF; if (!f) return;
    const ds = lkOf(S.V.byMa[f.ma]), dung = f.lk.map((r) => r.id);
    const k = ds.find((x) => dung.indexOf(x.id) < 0);
    f.lk.push(k ? { id: k.id, sl: '1', loai: loaiMacDinh(k) } : { id: '__khac', ten: '', dv: '', sl: '1', loai: 'THAY' });

    const r = $$('.lkin'); const last = r[r.length - 1]; if (last) { const i = $('[data-lf="ten"]', last) || $('[data-lf="sl"]', last); if (i) i.focus(); }
  },
  lkDel: (el) => { const f = S.ctF; if (!f) return; f.lk.splice(+el.dataset.i, 1); lkPaint(); },
  lkSug: (el) => {
    const f = S.ctF, r = f && f.lk[+el.dataset.i], x = khoGet(el.dataset.ma); if (!r || !x) return;
    const co = lkOf(S.V.byMa[f.ma]).find((k) => { const g = khoGet(k.maKho); return g && g.ma === x.ma; });
    if (co) { r.id = co.id; r.loai = loaiMacDinh(co); delete r.maKho; } else Object.assign(r, { ten: x.ten, dv: dvTxt(x.dv).slice(0, 12), quyCach: x.qc || '', maKho: x.ma });
    lkPaint();
    const row = $(`.lkin[data-i="${el.dataset.i}"]`), q = row && $('[data-lf="sl"]', row); if (q) q.focus();
  },
  lkUnlink: (el) => { const f = S.ctF, r = f && f.lk[+el.dataset.i]; if (r) { delete r.maKho; r.quyCach = ''; lkPaint(); } },
  dsKhoAdd: (el) => {
    const p = topV().p, x = khoGet(el.dataset.ma); if (!x) return;
    if (p.ds.some((k) => { const g = khoGet(k.maKho); return g && g.ma === x.ma; })) { toast(t('khoDaCo'), true); return; }
    p.ds.push(Object.assign({ id: newId('LK'), sl: '', ghiChu: '' }, lkTuKho(x)));

  },
  dsSug: (el) => {
    const p = topV().p, i = +el.dataset.i, x = khoGet(el.dataset.ma); if (!x || !p.ds[i]) return;
    if (p.ds.some((k, j) => { const g = khoGet(k.maKho); return j !== i && g && g.ma === x.ma; })) { toast(t('khoDaCo'), true); return; }
    Object.assign(p.ds[i], lkTuKho(x)); render();
  },
  dsUnlink: (el) => { const p = topV().p, x = p.ds[+el.dataset.i]; if (x) { delete x.maKho; render(); } },

});

  if (!nh || !nh.luc) return null;
  return { nh, ngay: diffD(TODAY(), nh.luc.slice(0, 10)) };
}

}

      <div class="hscroll" style="margin:12px 0 0">${chip('', 'all')}${chip('con', 'kfCon')}${chip('het', 'kfHet')}${chip('may', 'kfMay')}${chip('app', 'kfApp')}</div>

function khoBody() {
  const f = S.f, dung = khoDungMap();
  const filt = { con: (x) => (tonOf(x) || 0) > 0, het: (x) => tonOf(x) === 0, app: (x) => x.ng === 'APP', may: (x) => !!dung[x.ma] }[f.khoF] || null;
  const list = khoFind(f.khoQ, filt), lim = f.khoLim || 60;
  let o = sec('khoKQ', fmtNum(list.length, 0));
  if (!list.length) return o + `<div class="card empty">${t('khoKhongThay')}</div>`;
  o += `<div class="list">${list.slice(0, lim).map((x) => khoRow(x, dung[x.ma])).join('')}</div>`;
  if (list.length > lim) o += `<button class="btn ghost wide" style="margin-top:10px" data-act="khoMore">${t('khoMore', { n: fmtNum(list.length - lim, 0) })}</button>`;
  return o;
}
// "AB21 ×1 · AC21 ×3"; hàng ở nhiều kho thì thêm tên kho ngắn "K2·AB21"
function khoBinTxt(x, soLuong) {
  const vt = x.vt || [], nhieu = new Set(vt.map((v) => v[0])).size > 1;
  khoIx();
  return vt.map((v) => (nhieu && KHO_TEN[v[0]] ? KHO_TEN[v[0]] + '·' : '') + (v[1] || '—') + (soLuong && vt.length > 1 ? ' ×' + soG(v[2]) : ''));
}
function khoRow(x, dung) {
  const bins = khoBinTxt(x, true);
  return `<button class="row khorow" data-act="khoItem" data-ma="${esc(x.ma)}"><div class="main"><div class="nm">${lkTenH(x.ten)}</div>
    <div class="sub"><span class="code">${esc(x.ma)}</span>${x.qc ? ` <span class="qc">${esc(x.qc)}</span>` : ''}</div>
    ${bins.length || dung ? `<div class="sub kmeta">${bins.length ? `<span class="kbin">${IC.pin}${esc(bins.slice(0, 4).join(' · '))}${bins.length > 4 ? ' +' + (bins.length - 4) : ''}</span>` : ''}${dung ? `<span class="kmay">⚙ ${dung.length}</span>` : ''}</div>` : ''}</div>
    <div class="end">${tonHtml(x)}</div></button>`;
}
function khoLanThay(ma) {
  const out = [];
  if (!S.V) return out;
  S.V.ls.forEach((x) => {
    if (x.trangThai === 'HUY' || !x.chiTiet || !x.chiTiet.lk) return;
    const m = S.V.byMa[x.ma];
    x.chiTiet.lk.forEach((k) => {
      const mk = k.maKho || ((lkOf(m).find((y) => y.id === k.id) || {}).maKho);
      const g = khoGet(mk);
      if (g && g.ma === ma) out.push({ x, k });
    });
  });
  return out.sort((a, b) => (b.x.ngay > a.x.ngay ? 1 : b.x.ngay < a.x.ngay ? -1 : 0));
}
function openKhoItem(ma) {
  const x = khoGet(ma); if (!x) { toast(t('notFound'), true); return; }
  const dung = khoDungMap()[x.ma] || [], lan = khoLanThay(x.ma), app = x.ng === 'APP';
  const sua = app && can('may') && !srvOld('kho');
  const vt = x.vt || [];
  openSheet(`<div class="grab"></div>
    <h3>${lkTenH(x.ten)}</h3>
    <div class="who"><span class="code">${esc(x.ma)}</span> ${tonHtml(x)}${x.an ? ` <span class="tag tag-cu">${t('khoDaAn')}</span>` : ''}</div>
    <dl class="kv">
      ${x.qc ? `<dt>${t('quyCach')}</dt><dd>${esc(x.qc)}</dd>` : ''}
      ${x.dv ? `<dt>${t('dv')}</dt><dd>${esc(dvTxt(x.dv))}</dd>` : ''}
      ${x.nh ? `<dt>${t('nhomKho')}</dt><dd class="mono">${esc(x.nh)}</dd>` : ''}
      <dt>${t('nguon')}</dt><dd>${t(app ? 'nguonAPP' : 'nguonERP')}${!app && !x.cf ? `<div class="bad" style="font-weight:500">${t('khoNgoaiFile')}</div>` : ''}</dd>
      ${x.gc ? `<dt>${t('ghiChuLK')}</dt><dd style="font-weight:500">${esc(x.gc)}</dd>` : ''}
      ${x.cn ? `<dt>${t('khoCn')}</dt><dd class="mono" style="font-weight:500">${esc(fmtD(x.cn.slice(0, 10)) + ' ' + x.cn.slice(11, 16))}</dd>` : ''}
    </dl>
    ${vt.length ? secL('khoViTri', vt.length) + `<div class="list">${vt.map((v) => `<div class="row"><div class="main"><div class="nm mono">${esc(v[1] || '—')}</div><div class="sub">${KHO_TEN[v[0]] ? `<b>${esc(KHO_TEN[v[0]])}</b> · ` : ''}${esc(v[0])}</div></div><div class="end"><b class="mono">${esc(soG(v[2]))}</b> <span class="muted">${esc(dvTxt(x.dv))}</span></div></div>`).join('')}</div>` : ''}
    ${secL('khoDungMay', dung.length)}
    ${dung.length ? `<div class="list">${dung.map(({ m, k }) => `<button class="row" data-act="may" data-ma="${esc(m.ma)}"><div class="main"><div class="nm">${esc(m.ten)}</div>
      <div class="sub"><span class="code">${esc(m.ma)}</span>${k.sl !== '' && k.sl !== undefined && k.sl !== null ? ` · ${t('trenMay')}: <b class="mono">${esc(soG(k.sl))}</b> ${esc(k.dv || '')}` : ''}</div></div>${IC.chev}</button>`).join('')}</div>` : `<div class="card empty">${t('khoChuaDung')}</div>`}
    ${lan.length ? secL('khoDaThay', lan.length) + `<div class="list">${lan.slice(0, 30).map(({ x: h, k }) => `<button class="hrow" data-act="hdetail" data-id="${esc(h.id)}">
      <div class="dd">${fmtDM(h.ngay)}<small>${h.ngay.slice(0, 4)}</small></div>
      <div class="main"><div class="nm">${esc((S.V.byMa[h.ma] || {}).ten || h.tenMay)}</div><div class="sub"><span class="mono">×${esc(soG(k.sl))}</span> ${esc(k.dv || '')} · ${t(k.loai === 'BOSUNG' ? 'boSung' : 'thay')} · ${esc(h.nguoi)}</div></div>${hTag(h)}</button>`).join('')}</div>` : ''}
    ${sua ? `${secL('khoSuaApp', '')}<div class="card pad">
      <label class="fld"><span>${t('lkTen')}</span><input class="inp" id="kxTen" value="${esc(x.ten)}" maxlength="160"></label>
      <div class="dsgrid"><label class="fld"><span>${t('quyCach')}</span><input class="inp" id="kxQc" value="${esc(x.qc || '')}" maxlength="200"></label>
      <label class="fld"><span>${t('dv')}</span><input class="inp" id="kxDv" value="${esc(x.dv || '')}" maxlength="12"></label></div>
      <div class="err" id="kxErr" hidden></div>
      <div class="btns"><button class="btn ghost" data-act="khoAn" data-ma="${esc(x.ma)}" data-v="${x.an ? 0 : 1}">${t(x.an ? 'khoHienLai' : 'khoAn')}</button><button class="btn" data-act="khoSua" data-ma="${esc(x.ma)}">${t('save')}</button></div></div>` : ''}
    <div class="btns" style="margin-top:16px"><button class="btn ghost" data-act="closeSheet">${t('close')}</button></div>`);
}
async function khoLuuApp(el, p) {
  const fe = $('#kxErr');
  el.disabled = true;
  try {
    const d = await api('saveKho', p);
    mergeResult(d);
    closeSheet(); toast(t('saved')); render();
  } catch (e) { el.disabled = false; if (fe) { fe.innerHTML = e.code === 'MANG' ? t('needNet') : errMsg(e); fe.hidden = false; } }
}

// ---------- Nhập file kho: đọc → xem trước → lưu ----------
async function khoChonFile(e) {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  toast(t('khoDoc'));
  try {
    const r = await docFileKho(f);
    if (!r.ds.length) throw { code: 'KHO_TRONG' };
    go('khoNhap', { r, d: khoDiff(r.ds) });
    const tt = $('.toast'); if (tt) tt.remove();
  } catch (x) { toast(errMsg(x), true); }
}
const khoKhoa = (ten, qc) => norm(ten).replace(/\s/g, '') + '|' + norm(qc).replace(/\s/g, '');
// So với kho đang có: giống cách máy chủ tính
function khoDiff(ds) {
  khoIx();
  const d = { moi: [], doiTon: [], het: [], veLai: [], doiTen: [], gop: [], giu: 0 }, theo = {}, erpKhoa = {};
  ds.forEach((o) => {
    theo[o.ma] = 1;
    const k = khoKhoa(o.ten, o.qc); if (!erpKhoa[k]) erpKhoa[k] = o.ma;
    const x = KHO_BY[o.ma];
    if (!x) { d.moi.push({ o }); return; }
    const cuTon = tonOf(x) || 0, doiTon = cuTon !== o.ton || JSON.stringify(x.vt || []) !== JSON.stringify(o.vt);
    const doiTen = x.ten !== o.ten || (x.qc || '') !== o.qc || (x.dv || '') !== o.dv || (x.nh || '') !== o.nh;
    if (!x.cf) d.veLai.push({ o, cu: cuTon }); else if (doiTon) d.doiTon.push({ o, cu: cuTon });
    if (doiTen) d.doiTen.push({ o, x });
    if (x.cf && !doiTon && !doiTen) d.giu++;
  });
  S.kho.ds.forEach((x) => {
    if (x.ng === 'ERP' && x.cf && !theo[x.ma]) d.het.push({ o: x, cu: tonOf(x) || 0 });
    if (x.ng === 'APP' && !x.gop && erpKhoa[khoKhoa(x.ten, x.qc)]) d.gop.push({ o: x, vao: erpKhoa[khoKhoa(x.ten, x.qc)] });
  });
  d.cuCf = S.kho.ds.filter((x) => x.ng === 'ERP' && x.cf).length;
  return d;
}
VIEWS.khoNhap = {
  html(p) {
    const r = p.r, d = p.d;
    if (!r) return `<div class="card empty">${t('notFound')}</div>`;
    let o = srvWarn('kho') + `<div class="card pad"><dl class="kv">
      <dt>${t('khoFile')}</dt><dd class="mono" style="font-size:13px">${esc(r.file)}</dd>
      <dt>${t('khoSheet')}</dt><dd>${esc(r.sheet)}</dd>
      <dt>${t('khoKQ')}</dt><dd>${t('khoDong', { n: fmtNum(r.soDong, 0), m: fmtNum(r.ds.length, 0) })}${r.boQua ? `<div class="muted" style="font-weight:500">${t('khoBoQua', { n: r.boQua })}</div>` : ''}</dd>
      <dt>${t('khoCotDoc')}</dt><dd style="font-weight:500">${esc(r.cot.join(' · '))}</dd></dl></div>`;
    if (d.cuCf >= 20 && r.ds.length < d.cuCf * 0.5) o += `<div class="note" style="margin-top:12px">${t('khoItWarn', { n: r.ds.length, c: d.cuCf })}</div>`;
    const tile = (k, n, cls) => `<div class="tile ktile ${cls}${n ? '' : ' zero'}"><b>${fmtNum(n, 0)}</b><span>${t(k)}</span></div>`;
    o += `<div class="tiles ktiles" style="margin-top:14px">${tile('kMoi', d.moi.length, 't-sap')}${tile('kDoiTon', d.doiTon.length, 't-nay')}${tile('kHet', d.het.length, 't-qua')}${tile('kVeLai', d.veLai.length, 't-xong')}${tile('kGiu', d.giu, '')}${d.gop.length ? tile('kGop', d.gop.length, '') : ''}</div>`;
    const tonTxt = (n, dv) => `<b class="mono">${esc(soG(n))}</b> <span class="muted">${esc(dvTxt(dv))}</span>`;
    const grp = (k, arr, row, help) => (arr.length ? `<details class="kdet"><summary>${t(k)} <span class="cnt mono">${fmtNum(arr.length, 0)}</span></summary>${help ? `<div class="help" style="margin:0 0 8px">${t(help)}</div>` : ''}
      <div class="list">${arr.slice(0, 200).map(row).join('')}</div>${arr.length > 200 ? `<div class="help">${t('khoChiHien', { n: 200 })}</div>` : ''}</details>` : '');
    const row = (x, end) => `<div class="row"><div class="main"><div class="nm">${lkTenH(x.ten)}</div><div class="sub"><span class="code">${esc(x.ma)}</span>${x.qc ? ` <span class="qc">${esc(x.qc)}</span>` : ''}</div></div><div class="end kchg">${end}</div></div>`;
    o += '<div style="margin-top:14px">';
    o += grp('kMoi', d.moi, ({ o: x }) => row(x, tonTxt(x.ton, x.dv)));
    o += grp('kDoiTon', d.doiTon, ({ o: x, cu }) => row(x, `<span class="mono muted">${esc(soG(cu))}</span> → ${tonTxt(x.ton, x.dv)}`));
    o += grp('kHet', d.het, ({ o: x, cu }) => row(x, `<span class="mono muted">${esc(soG(cu))}</span> → <b class="mono bad">0</b>`), 'kHetHelp');
    o += grp('kVeLai', d.veLai, ({ o: x }) => row(x, `<span class="mono muted">0</span> → ${tonTxt(x.ton, x.dv)}`));
    o += grp('kDoiTen', d.doiTen, ({ o: x }) => row(x, ''));
    o += grp('kGop', d.gop, ({ o: x, vao }) => row(x, `→ <span class="code">${esc(vao)}</span>`));
    o += '</div>';
    o += `<div class="err" id="knErr" hidden></div><div class="btns" style="margin-top:16px"><button class="btn ghost" data-act="back">${t('cancel')}</button>
      <button class="btn g" id="knSave" data-act="khoLuu">${IC.check} ${t('khoLuu')}</button></div>`;
    return o;
  }
};
async function khoLuu(el) {
  const p = topV().p, r = p.r, fe = $('#knErr');
  el.disabled = true; fe.hidden = true;
  const lbl = el.innerHTML; el.innerHTML = t('khoDangLuu');
  try {
    const d = await api('importKho', { file: r.file, soDong: r.soDong, ds: r.ds }, { timeout: 240 });
    khoSet({ ver: d.ver, ds: d.ds, nhap: d.nhap });
    if (S.base) S.base.kho = { ver: d.ver, n: d.ds.filter((x) => !x.an && !x.gop).length, nhap: d.nhap };
    mergeResult({ dsMay: d.dsMay || [] });
    S.f.khoQ = ''; S.f.khoF = ''; S.f.khoLim = 60;
    back();
    toast(t('khoDaLuu', { n: fmtNum(d.tk.soMa, 0), a: d.tk.moi, b: d.tk.het }));
  } catch (e) {
    el.disabled = false; el.innerHTML = lbl;
    fe.innerHTML = e.code === 'MANG' ? t('needNet') : errMsg(e); fe.hidden = false;
  }
}

// ---------- Trang chủ: nhắc Quản lý nhập file kho mỗi tuần ----------
function khoHomeCard() {
  if (!can('may') || !S.base || !S.base.kho || srvOld('kho')) return '';
  const inf = khoNhapInfo();
  if (inf && inf.ngay < 7) return '';
  return `<button class="ecard khohome" data-act="tab" data-v="kho"><span class="eic">${IC.box}</span>
    <span class="main"><span class="nm">${t('khoHome')}</span><span class="sub">${inf ? t('khoCu', { n: inf.ngay }) : t('khoChuaNhap')}</span></span>
    ${IC.chev}</button>`;
}

// ---------- Chọn linh kiện trong kho (màn sửa linh kiện, bảng xác nhận) ----------
function khoSugHtml(q, act, i, lim) {
  if (!S.kho.ds.length || norm(q).length < 2) return '';
  const list = khoFind(q).slice(0, lim || 5);
  if (!list.length) return '';
  return `<div class="ksug"><div class="kst">${t('khoGoiY')}</div>${list.map((x) => `<button type="button" class="ksi" data-act="${act}" data-ma="${esc(x.ma)}"${i !== undefined ? ` data-i="${i}"` : ''}>
    <span class="kn">${lkTenH(x.ten)}<small><span class="mono">${esc(x.ma)}</span>${x.qc ? ' · ' + esc(x.qc) : ''}</small></span>${tonHtml(x)}</button>`).join('')}</div>`;
}
function khoTimHtml(q) {
  if (!S.kho.ds.length || !norm(q)) return '';
  const list = khoFind(q).slice(0, 12);
  if (!list.length) return `<div class="ksug"><div class="kst">${t('khoKhongThay')}</div></div>`;
  return `<div class="ksug">${list.map((x) => `<button type="button" class="ksi" data-act="dsKhoAdd" data-ma="${esc(x.ma)}">
    <span class="kn">${lkTenH(x.ten)}<small><span class="mono">${esc(x.ma)}</span>${x.qc ? ' · ' + esc(x.qc) : ''}</small></span>${tonHtml(x)}<span class="kplus">${IC.plus}</span></button>`).join('')}</div>`;
}
// Linh kiện của máy lấy từ một mục kho
const lkTuKho = (x) => ({ ten: x.ten, quyCach: x.qc || '', dv: dvTxt(x.dv).slice(0, 12), maKho: x.ma });

Object.assign(ACT, {
  khoF: (el) => { S.f.khoF = el.dataset.v; S.f.khoLim = 60; render(); },
  khoMore: () => { S.f.khoLim = (S.f.khoLim || 60) + 200; const b = $('#khoBody'); if (b) b.innerHTML = khoBody(); },
  khoItem: (el) => openKhoItem(el.dataset.ma),
  khoLuu: (el) => khoLuu(el),
  khoSua: (el) => khoLuuApp(el, { ma: el.dataset.ma, ten: $('#kxTen').value, qc: $('#kxQc').value, dv: $('#kxDv').value }),
  khoAn: (el) => khoLuuApp(el, { ma: el.dataset.ma, an: el.dataset.v === '1' })
});

// Link từ tem QR: ...?m=M001
try {
  const m = new URLSearchParams(location.search).get('m');
  if (m) { S.deepMa = m.toUpperCase(); history.replaceState(null, '', location.pathname); }
} catch (e) { /* bỏ qua */ }
if (!IS_DEMO && 'serviceWorker' in navigator && (/^https:/.test(location.protocol) || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
