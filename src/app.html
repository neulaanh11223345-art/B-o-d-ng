// Ngưỡng "gần hết": linh kiện có tồn tối thiểu riêng thì theo số riêng, không thì theo cài đặt chung (mặc định 1)
const khoGanHetN = () => {
  const v = S.base && S.base.caiDat ? S.base.caiDat.khoGanHet : undefined;
  return v === undefined || v === '' || !(+v >= 0) ? 1 : +v;
};
const khoNguongOf = (x) => (x.tonMin === undefined || x.tonMin === '' ? khoGanHetN() : +x.tonMin);
// Linh kiện có tồn kho an toàn: chỉ báo thiếu khi tồn tụt xuống dưới bao nhiêu phần trăm mức an toàn
const khoPhanTramN = () => {
  const v = S.base && S.base.caiDat ? S.base.caiDat.khoPhanTram : undefined;
  return v === undefined || v === '' || !(+v > 0) ? 15 : +v;
};
// Mốc báo thiếu của một linh kiện đã đặt tồn an toàn
const khoMocBao = (x) => Math.round(+x.tonMin * khoPhanTramN()) / 100;
// '' = đủ hàng · 'het' = hết sạch · 'thieu' = tụt dưới mức báo thiếu · 'thap' = gần hết (chưa đặt tồn an toàn)
// Đã đặt tồn kho an toàn thì chỉ báo khi tồn tụt xuống dưới PHẦN TRĂM mức an toàn (mặc định 15%),
// còn trên mức đó thì coi như vẫn dùng được, không kêu.
// Chưa đặt tồn an toàn thì gần hết khi tồn ≤ ngưỡng chung (mặc định 1).
function khoMuc(x) {
  const n = tonOf(x);
  if (n === null) return '';
  if (n <= 0) return 'het';
  const mn = x.tonMin;
  if (mn === undefined || mn === '') return n <= khoGanHetN() ? 'thap' : '';
  return n < khoMocBao(x) ? 'thieu' : '';
}
function khoThap(x) { return !!khoMuc(x); }
// Còn thiếu bao nhiêu nữa mới đủ tồn an toàn
function khoCanThem(x) {
  const mn = x.tonMin;
  if (mn === undefined || mn === '') return 0;
  return Math.max(0, Math.round((+mn - (tonOf(x) || 0)) * 1000) / 1000);
}
// Số lần nhập liên tiếp gần nhất mà tồn bằng 0
function khoLanHet(h) { let n = 0; for (let i = h.length - 1; i >= 0 && h[i] <= 0; i--) n++; return n; }
// Linh kiện ĐÃ DÙNG: gắn vào máy, hoặc từng thay trong lịch sử bảo dưỡng / sửa chữa / công việc
let KHO_DUNG_CACHE = null;
function khoDaDungMap() {
  const key = (S.kho.ver || '') + '|' + S.kho.ds.length + '|' + (S.V ? S.V.ls.length + '|' + (S.V.cvAll || []).length : '-');
  if (KHO_DUNG_CACHE && KHO_DUNG_CACHE.k === key) return KHO_DUNG_CACHE.m;
  const m = khoDungMap();
  const them = (ma) => { const g = khoGet(ma); if (g && !m[g.ma]) m[g.ma] = []; };
  if (S.V) {
    S.V.ls.forEach((h) => {
      if (h.trangThai === 'HUY' || !h.chiTiet || !h.chiTiet.lk) return;
      h.chiTiet.lk.forEach((k) => them(k.maKho));
    });
    (S.V.cvAll || []).forEach((v) => (v.linhKien || []).forEach((k) => them(k.maKho)));
  }
  KHO_DUNG_CACHE = { k: key, m };
  return m;
}
// Danh sách nhắc hàng, chia ba nhóm
function khoNhacDS() {
  const dung = khoDaDungMap(), out = { vuaHet: [], dangHet: [], thieu: [], ganHet: [], n: 0 };
  const xet = {};
  Object.keys(dung).forEach((ma) => { xet[ma] = dung[ma]; });
  // Linh kiện đã đặt tồn kho an toàn cũng theo dõi, dù chưa gắn vào máy nào
  S.kho.ds.forEach((x) => { if (!x.an && !x.gop && x.tonMin !== undefined && x.tonMin !== '' && !xet[x.ma]) xet[x.ma] = []; });
  Object.keys(xet).forEach((ma) => {
    const x = khoGet(ma);
    if (!x || x.an) return;          // đã bỏ theo dõi thì thôi nhắc
    const muc = khoMuc(x);
    if (!muc) return;
    const h = x.tonCu || [], truoc = h.length > 1 ? h[h.length - 2] : null;
    const o = { x, dung: xet[ma] || [], truoc, lanHet: khoLanHet(h), can: khoCanThem(x) };
    if (muc === 'thieu') out.thieu.push(o);
    else if (muc === 'thap') out.ganHet.push(o);
    else if (truoc !== null && truoc > 0) out.vuaHet.push(o);
    else out.dangHet.push(o);
  });
  const sx = (a, b) => String(a.x.ten || '').localeCompare(String(b.x.ten || ''));
  out.vuaHet.sort((a, b) => b.can - a.can || sx(a, b));
  out.dangHet.sort((a, b) => b.lanHet - a.lanHet || b.can - a.can || sx(a, b));
  out.thieu.sort((a, b) => b.can - a.can || sx(a, b));
  out.ganHet.sort((a, b) => (tonOf(a.x) || 0) - (tonOf(b.x) || 0) || sx(a, b));
  out.n = out.vuaHet.length + out.dangHet.length + out.thieu.length + out.ganHet.length;
  return out;
}
// Tồn của mã này qua các lần nhập file gần đây (mốc thời gian lấy chung ở S.kho.moc)
function khoLichSuHtml(x) {
  const h = x.tonCu || [];
  if (h.length < 2) return '';
  const m = (S.kho.moc || []).slice(-h.length), ng = khoNguongOf(x);
  return secL('khoLichSuTon', h.length) + `<div class="list">${h.map((v, i) => {
    const mc = m[i] || null, cls = v <= 0 ? ' bad' : v <= ng ? ' warnx' : '';
    return `<div class="row"><div class="main"><div class="nm mono">${mc && mc.luc ? esc(fmtD(mc.luc.slice(0, 10))) : '—'}</div>
      ${mc && mc.file ? `<div class="sub">${esc(mc.file)}</div>` : ''}</div>
      <div class="end"><b class="mono${cls}">${esc(soG(v))}</b></div></div>`;
  }).reverse().join('')}</div>`;
}
function khoNhacRow(o) {
  const x = o.x, n = tonOf(x), bins = khoBinTxt(x, false);
  const meta = [];
  if (o.truoc !== null) meta.push(`<span class="mono">${esc(soG(o.truoc))} → ${esc(soG(n))}</span>`);
  if (x.tonMin !== undefined && x.tonMin !== '') meta.push(`<span class="muted">${esc(tv('khoATn', { n: soG(x.tonMin), m: soG(khoMocBao(x)) }))}</span>`);
  if (o.can > 0) meta.push(`<span class="warnx">${esc(tv('khoCanThemN', { n: soG(o.can), d: dvTxt(x.dv || '') }))}</span>`);
  if (o.lanHet > 1) meta.push(`<span class="warnx">${esc(tv('khoHetNLan', { n: o.lanHet }))}</span>`);
  meta.push(o.dung.length ? `<span class="kmay">⚙ ${o.dung.length}</span>` : `<span class="muted">${esc(tv('khoTungThay'))}</span>`);
  if (bins.length) meta.push(`<span class="kbin">${IC.pin}${esc(bins.slice(0, 3).join(' · '))}</span>`);
  return `<button class="row khorow" data-act="khoItem" data-ma="${esc(x.ma)}"><div class="main"><div class="nm">${lkTenH(x.ten)}</div>
    <div class="sub"><span class="code">${esc(x.ma)}</span>${x.qc ? ` <span class="qc">${esc(x.qc)}</span>` : ''}</div>
    <div class="sub kmeta">${meta.join('')}</div></div>
    <div class="end">${tonHtml(x)}</div></button>`;
}

  if (!n) return {};
  const vt = (id) => { for (let i = 0; i < n; i++) if (ng[i].id === id) return i; return -1; };
  if (!truoc) return { NGAY: ng[0], DEM: ng[n > 1 ? 1 : 0] };
  const a = (vt(truoc.NGAY) + 1) % n;
  let b = (vt(truoc.DEM) + 1) % n;
  if (n > 1 && a === b) b = (b + 1) % n;
  return { NGAY: ng[a], DEM: ng[b] };
}
// Tên song ngữ của người trong app
function trucTen(x) {
  const n = (S.V && S.V.nvById && S.V.nvById[x.uid]) || {};
  const zh = n.tenZh && n.tenZh !== (x.ten || n.ten) ? n.tenZh : '';
  return esc(x.ten || n.ten || '') + (zh ? ` <span class="zi" lang="zh-CN">${esc(zh)}</span>` : '');
}
// Tổng số ca trong tháng: mỗi người bao nhiêu ngày, trong đó bao nhiêu Chủ nhật
function trucTongDS(ym) {
  const by = {};
  trucDS().forEach((x) => {
    if (!x.uid || x.ngay.slice(0, 7) !== ym) return;
    const o = by[x.uid] = by[x.uid] || { uid: x.uid, ten: x.ten, n: 0, cn: 0 };
    o.n++; if (wday(x.ngay) === 0) o.cn++;
  });
  return Object.values(by).sort((a, b) => b.n - a.n || a.ten.localeCompare(b.ten));
}
// Dữ liệu hiển thị = máy chủ + việc đang chờ gửi
function rebuildTruc() {
  const b = S.base;
  const lt = (b.lichTruc || []).map((x) => Object.assign({}, x));
  const pc = (b.phanCa || []).map((x) => Object.assign({}, x));
  const nt = (b.nguoiTruc || []).map((x) => Object.assign({}, x));
  const ntG = (id) => nt.filter((x) => x.id === id)[0] || null;
  const dat = (tuNgay, nhom, ca, ng) => {
    const o = { tuNgay, nhom, ca, nguoiId: ng ? ng.id : '', ten: ng ? ng.ten : '', tenZh: ng ? ng.tenZh : '',
      dienThoai: ng ? ng.dienThoai : '', cho: true };
    const i = pc.findIndex((x) => x.tuNgay === tuNgay && x.nhom === nhom && x.ca === ca);
    if (i >= 0) pc[i] = Object.assign({}, pc[i], o); else pc.push(o);
  };
  S.Q.forEach((q) => {
    if (q.st !== 'cho') return;
    if (q.action === 'dutySet') {
      const i = lt.findIndex((x) => x.ngay === q.p.ngay);
      const o = Object.assign({ ngay: q.p.ngay, uid: '', ten: '', noiDung: '', noiDungDich: '' }, i >= 0 ? lt[i] : {}, { cho: true });
      if (q.p.uid !== undefined) { o.uid = q.p.uid; o.ten = q.p.uid ? nvTen(q.p.uid) : ''; }
      if (q.p.noiDung !== undefined) { o.noiDung = q.p.noiDung; o.noiDungDich = q.p.noiDungDich || ''; }
      if (i >= 0) lt[i] = o; else lt.push(o);
    } else if (q.action === 'shiftSet') {
      dat(q.p.tuNgay, q.p.nhom, q.p.ca, q.p.id ? ntG(q.p.id) : null);
    } else if (q.action === 'shiftRotate') {
      TR_NHOM.forEach(([nhom]) => {
        const ng = nt.filter((x) => x.nhom === nhom && x.hoatDong).sort((a, b) => (a.thuTu - b.thuTu) || a.ten.localeCompare(b.ten));
        if (!ng.length) return;
        let tuan = '';
        pc.forEach((x) => { if (x.nhom === nhom && x.nguoiId && x.tuNgay < q.p.tuNgay && x.tuNgay > tuan) tuan = x.tuNgay; });
        let truoc = null;
        if (tuan) { truoc = {}; pc.forEach((x) => { if (x.nhom === nhom && x.tuNgay === tuan) truoc[x.ca] = x.nguoiId; }); }
        const chon = pcTiepTheo(ng, truoc);
        TR_CA.forEach(([ca]) => dat(q.p.tuNgay, nhom, ca, chon[ca]));
      });
    }
  });
  S.V.truc = lt; S.V.pc = pc; S.V.nt = nt;
}

    return `<div class="help" style="margin-bottom:12px">${t('pcDSHelp')}</div>
      <div class="list">${p.ds.map(row).join('')}</div>
      <button class="tcadd" data-act="ntThem">${t('pcThemNguoi')}</button>
      <div id="ntErr" class="err" hidden></div>
      <div class="btns" style="margin-top:14px"><button class="btn pri" id="ntOk">${IC.check} ${t('trucLuu')}</button></div>`;
  },
  after(p) {
    $$('[data-nf]').forEach((el) => el.addEventListener(el.type === 'checkbox' ? 'change' : 'input', () => {
      const [i, k] = el.dataset.nf.split(':');
      if (k === 'nghi') p.ds[+i].hoatDong = !el.checked; else p.ds[+i][k] = el.value;
    }));
    $('#ntOk').addEventListener('click', async () => {
      const e = $('#ntErr'), b = $('#ntOk');
      const ds = p.ds.filter((x) => String(x.ten || '').trim());
      if (!ds.length) { e.hidden = false; e.textContent = tp('pcCanTen'); return; }
      e.hidden = true; b.disabled = true;
      const r = await send('shiftPeople', { ds });
      b.disabled = false;
      if (r.err) { e.hidden = false; e.textContent = errMsg(r.err); return; }
      toast(r.queued ? t('savedLocal') : t('pcDSLuu'));
      back();
    });
  }
};

Object.assign(ACT, {
  trucTuan: (el) => { S.f.trucTuan = addD(trucTuanHT(), 7 * +el.dataset.d); render(); window.scrollTo(0, 0); },
  trucThang: (el) => {
    let [y, m] = trucThangHT().split('-').map(Number);
    m += +el.dataset.d; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
    S.f.trucThang = y + '-' + String(m).padStart(2, '0'); render();
  },
  trucXep: (el) => go('trucGhi', { d: el.dataset.d }),
  trucBo: async (el) => {
    const r = await send('dutySet', { ngay: el.dataset.d, uid: '', noiDung: '' });
    if (r.err) { toast(errMsg(r.err), true); return; }
    toast(r.queued ? t('savedLocal') : t('trucDaBo'));
    if (topV().v === 'trucGhi') back(); else render();
  },
  pcChon: (el) => {
    const { nhom, ca } = el.dataset, tu = trucTuanHT(), cur = pcO(tu, nhom, ca);
    const ng = ntDS(nhom);
    openSheet(`<div class="grab"></div><h3>${tv('pcChonNguoi')}<span class="zi">${tz('pcChonNguoi')}</span></h3>
      <p class="help">${esc(tp(nhom === 'SX' ? 'pcSX' : 'pcKHO'))} · ${esc(tp(ca === 'NGAY' ? 'pcCaNgay' : 'pcCaDem'))}</p>
      <div class="nvlist">
        ${ng.map((n) => `<button type="button" class="nvc${cur && cur.nguoiId === n.id ? ' on' : ''}" data-act="pcChonOk" data-nhom="${nhom}" data-ca="${ca}" data-id="${esc(n.id)}">
          <span class="av sm">${esc(initials(n.ten))}</span><span class="nvt"><b>${esc(n.ten)}</b>${n.tenZh ? ` <span class="zi" lang="zh-CN">${esc(n.tenZh)}</span>` : ''}<small class="mono">${esc(n.dienThoai || '')}</small></span></button>`).join('')}
        <button type="button" class="nvc" data-act="pcChonOk" data-nhom="${nhom}" data-ca="${ca}" data-id=""><span class="av sm">—</span><span class="nvt"><b>${esc(tv('pcOTrong'))}</b><small>${esc(tz('pcOTrong'))}</small></span></button></div>`);
  },
  pcChonOk: async (el) => {
    const { nhom, ca, id } = el.dataset;
    closeSheet();
    const r = await send('shiftSet', { tuNgay: trucTuanHT(), nhom, ca, id });
    if (r.err) { toast(errMsg(r.err), true); return; }
    toast(r.queued ? t('savedLocal') : t('saved'));
    render();
  },
  pcLP: () => {
    openSheet(`<div class="grab"></div><h3>${tv('pcLuanPhien')}<span class="zi">${tz('pcLuanPhien')}</span></h3>
      <p class="help">${t('pcLPHoi')}</p><p class="help">${t('pcLPHelp')}</p>
      <div class="btns"><button class="btn pri" data-act="pcLPOk">${t('pcLuanPhien')}</button>
        <button class="btn ghost" data-act="closeSheet">${t('cancel')}</button></div>`);
  },
  pcLPOk: async () => {
    closeSheet();
    const r = await send('shiftRotate', { tuNgay: trucTuanHT() });
    if (r.err) { toast(errMsg(r.err), true); return; }
    toast(r.queued ? t('savedLocal') : t('pcLPOk'));
    render();
  },
  pcIn: () => {
    $('#printArea').innerHTML = pcInHtml(trucTuanHT());
    setTimeout(() => window.print(), 300);
  },
  ntThem: () => {
    const p = topV().p;
    p.ds.push({ id: '', ten: '', tenZh: '', dienThoai: '', nhom: 'SX', thuTu: p.ds.length + 1, hoatDong: true });
    render();
  },
  ntDoi: (el) => {
    const p = topV().p, i = +el.dataset.i, j = i + +el.dataset.d;
    if (j < 0 || j >= p.ds.length) return;
    const a = p.ds[i]; p.ds[i] = p.ds[j]; p.ds[j] = a;
    render();
  }
});

// Link từ tem QR: ...?m=M001
try {
  const q = new URLSearchParams(location.search), m = q.get('m');
  API_LINK = q.get('api') || '';
  if (m) S.deepMa = m.toUpperCase();
  if (m || API_LINK) history.replaceState(null, '', location.pathname);
} catch (e) { /* bỏ qua */ }
if (!IS_DEMO && 'serviceWorker' in navigator && (/^https:/.test(location.protocol) || location.hostname === 'localhost')) {
  // Có bản app mới (service worker mới nhận quyền): tải lại trang một lần để dùng ngay, không phải tắt mở app
  let daTai = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (daTai || !hadSW) return; daTai = true; location.reload(); });
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => {
    r.update().catch(() => {});
    r.addEventListener('updatefound', () => { const w = r.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) toast(t('newVersion')); }); });
  }).catch(() => {});
}
store.init().then(() => { S.lastSync = store.get('bd_sync', 0); khoTuMay(); IMG_CACHE_LOAD(); boot(); });

</script>
